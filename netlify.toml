[functions]
  directory = "netlify/functions"
  included_files = ["node_modules/pdfjs-dist/build/pdf.worker.mjs"]

[dev]
framework = "#custom"
  command = "npm run preview -- --host 127.0.0.1 --port 5173"
  targetPort = 5173
  port = 4173
  functions = "netlify/functions"
  functionsPort = 9999

[build]
  command = "node scripts/write-netlify-runtime-provenance.mjs && npm run build"
  publish = "dist"
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- src public netlify/functions package.json package-lock.json index.html vite.config.ts tailwind.config.js postcss.config.js netlify.toml"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/canonical-import-execute"
  to = "/.netlify/functions/canonical-import-execute"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
