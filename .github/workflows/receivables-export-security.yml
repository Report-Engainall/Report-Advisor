name: receivables-export-security
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Export tenant authority contract
        run: npx vitest run src/lib/export-tenant-authority.contract.test.ts
      - name: Typecheck
        run: npm run typecheck
