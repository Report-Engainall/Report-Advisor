name: decision-dml-boundary
on:
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: decision-dml-boundary-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Decision lifecycle DML boundary
        run: node scripts/check-decision-runtime-dml-boundary.mjs
