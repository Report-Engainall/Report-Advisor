name: Canonical Intelligence Hardening
on:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run canonical intelligence boundary tests
        run: node scripts/check-canonical-intelligence-period-cost-boundaries.mjs
