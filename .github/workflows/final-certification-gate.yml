name: Final Certification Gate
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certification-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Assert certification checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$expected" = "$actual"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            test "$actual" = "${{ github.event.pull_request.head.sha }}"
          else
            test "$actual" = "${GITHUB_SHA}"
          fi
          echo "CERTIFICATION_EXACT_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Run certification contract tests
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/check-*.mjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Enforce exact commit evidence
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          echo "CERTIFICATION_EXACT_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
          echo "Repository certification contracts: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Live/production certification remains dependent on external runtime evidence." >> "$GITHUB_STEP_SUMMARY"
