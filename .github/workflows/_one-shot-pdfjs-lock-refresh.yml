name: one-shot-pdfjs-lock-refresh
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh pdfjs-dist lock entry only
        run: npm install --package-lock-only --ignore-scripts --no-save pdfjs-dist@6.3.289
      - name: Validate and self-delete
        run: |
          git diff --check
          node -e "const l=require('./package-lock.json'); if(l.packages?.['node_modules/pdfjs-dist']?.version!=='6.3.289') process.exit(1)"
          git rm .github/workflows/_one-shot-pdfjs-lock-refresh.yml
          git add package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: update pdfjs-dist lock for node text extraction'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
