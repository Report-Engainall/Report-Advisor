name: one-shot-pdfjs-lock-refresh
on:
  pull_request:
    types: [synchronize]
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh pdfjs-dist lock entry
        run: |
          cp package.json /tmp/report-advisor-package.json
          npm install --package-lock-only --ignore-scripts pdfjs-dist@6.3.289
          cp /tmp/report-advisor-package.json package.json
          npm install --package-lock-only --ignore-scripts
      - name: Validate lock and self-delete
        run: |
          set -euo pipefail
          git diff --check
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.dependencies?.['pdfjs-dist']!=='^6.2.108') process.exit(2); if(l.packages?.['node_modules/pdfjs-dist']?.version!=='6.3.289') process.exit(3); if(!l.packages?.['node_modules/pdfjs-dist']?.integrity) process.exit(4); if(!l.packages?.['node_modules/pdfjs-dist']?.resolved?.endsWith('/pdfjs-dist-6.3.289.tgz')) process.exit(5)"
          test -z "$(git diff -- package.json)"
          git restore --source="${GITHUB_EVENT_BEFORE}" -- .github/workflows/quality.yml
          git rm .github/workflows/_one-shot-pdfjs-lock-refresh.yml
          git add package-lock.json .github/workflows/quality.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: update pdfjs-dist lock for node text extraction'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
