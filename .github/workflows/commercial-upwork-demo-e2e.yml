name: Commercial Upwork Demo E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/commercial-upwork-demo-e2e.mjs'
      - '.github/workflows/commercial-upwork-demo-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:


permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  upwork-demo:
    if: startsWith(github.event.pull_request.head.ref || github.ref_name, 'commercial/')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install browser runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium and PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          npx playwright install --with-deps chromium
      - name: Build exact HEAD
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start exact-head preview
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/report-advisor-commercial-upwork.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/report-advisor-commercial-upwork.log
          exit 1
      - name: Verify authenticated E2E secret contract
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY USER_A_EMAIL USER_A_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "$name=MISSING"; exit 2; fi
          done
      - name: Run authenticated Upwork demo E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_REPORT_DIR: artifacts/commercial-upwork-demo
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
        run: node scripts/commercial-upwork-demo-e2e.mjs
      - name: Upload commercial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-upwork-demo-${{ env.EXACT_HEAD }}
          path: artifacts/commercial-upwork-demo
          if-no-files-found: warn
