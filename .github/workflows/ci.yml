name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Validate group demand normalization
        run: npm run test:group-demand
      - name: Validate group demand forecast
        run: npm run test:group-demand-forecast
      - name: Validate alternative group engine
        run: npm run test:alternative-group-engine
      - name: Validate group decision engine
        run: npm run test:group-decision-engine
