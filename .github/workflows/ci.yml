name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Validate permanent product/open-source reference registry
        run: npm run test:master-product-reference
      - name: Validate unified import contract
        run: npm run test:unified-import-contract
      - name: Validate import file/job lineage
        run: npm run test:import-file-binding
      - name: Validate intelligence data quality gate
        run: npm run test:intelligence-data-quality
      - name: Validate inventory aggregation
        run: npm run test:inventory-aggregation
      - name: Validate canonical metric and decision evidence gate
        run: npm run test:metric-decision-contract
      - name: Validate report readiness quality and evidence gate
        run: npm run test:report-readiness-contract
      - name: Validate canonical report thresholds
        run: npm run test:report-threshold-contract
      - name: Validate decision quality gate
        run: npm run test:decision-quality-gate
      - name: Validate open-source AI/document stack boundary
        run: npm run test:open-source-stack-contract
      - name: Validate zero-install AI runtime policy
        run: npm run test:zero-install-ai-contract
      - name: Validate zero-cost AI policy
        run: npm run test:zero-cost-ai-contract
      - name: Validate operational and financial intelligence engines
        run: npm run test:business-intelligence-engines
      - name: Validate advanced predictive intelligence
        run: npm run test:advanced-intelligence
      - name: Validate canonical intelligence integration
        run: npm run test:canonical-intelligence
      - name: Validate document intelligence gateway
        run: npm run test:document-intelligence
      - name: Validate financial decision intelligence
        run: npm run test:financial-decision-engines
      - name: Validate product-inspired command experience
        run: npm run test:product-experience
      - name: Validate group demand normalization
        run: npm run test:group-demand
      - name: Validate group demand forecast
        run: npm run test:group-demand-forecast
      - name: Validate group demand runtime contract
        run: npm run test:group-demand-runtime
      - name: Validate alternative group engine
        run: node scripts/check-alternative-group-engine.mjs
      - name: Validate group decision engine
        run: node scripts/check-group-decision-engine.mjs
      - name: Validate inventory and semantic metrics
        run: npm run test:inventory-semantic-contract
      - name: Validate production invariants
        run: npm run test:production-invariants
      - name: Validate tenant-safe query planner
        run: npm run test:query-planner
      - name: Validate query planner hardening
        run: npm run test:query-planner-hardening
      - name: Validate query executor cache and coalescing
        run: npm run test:query-executor
