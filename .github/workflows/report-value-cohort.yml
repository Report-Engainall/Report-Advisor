name: Report Value Cohort

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/report-value-cohort.mjs'
      - 'scripts/report-value-cohort-retry-contract.test.mjs'
      - 'scripts/report-value-cohort-scope-contract.test.mjs'
      - 'scripts/report-evidence-passport-contract.test.mjs'
      - 'src/lib/report-decisions.ts'
      - 'src/lib/decision-automation/vertical-slice-runtime.ts'
      - 'src/lib/report-smart.ts'
      - 'src/pages/SmartReportPage.tsx'
      - 'supabase/migrations/**'
      - 'package.json'
      - '.github/workflows/report-value-cohort.yml'

permissions:
  contents: read

concurrency:
  group: report-value-cohort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-value-cohort:
    runs-on: ubuntu-latest
    env:
      REPORT_ADVISOR_SUPABASE_URL: https://fnqbvfuwbdpwvhcgzksl.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Assert exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.event.pull_request.head.sha }}"
          printf 'EXACT_HEAD=%s\n' "$actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run passport contract
        run: npm run test:report-evidence-passport-contract

      - name: Validate bounded cohort retry policy
        run: node scripts/report-value-cohort-retry-contract.test.mjs

      - name: Validate explicit cohort tenant scope
        run: node scripts/report-value-cohort-scope-contract.test.mjs

      - name: Run 40-report business value cohort
        env:
          REPORT_ADVISOR_COHORT_COMPANY_IDS: '99e33354-cc45-4317-8eb3-0d486b6c5932,6426fbf9-7c4c-41b9-a6e7-9a0e58d5660b,038988ba-374a-45f8-84fe-9a4ff8a98e16,f68a7e91-3c7e-46fb-97a8-e339bec04e13,1f3298e1-b5c9-4ffd-8841-81cab095fd2b'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REPORT_ADVISOR_SUPABASE_URL}"
          test -n "${SUPABASE_SERVICE_ROLE_KEY}"
          mkdir -p artifacts/report-value-cohort
          npm run report:value-cohort | tee artifacts/report-value-cohort/cohort.json

      - name: Upload cohort proof
        uses: actions/upload-artifact@v4
        with:
          name: report-value-cohort-${{ github.event.pull_request.head.sha }}
          path: artifacts/report-value-cohort/cohort.json
          if-no-files-found: error
