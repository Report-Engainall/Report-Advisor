name: Diagnostic Lint Exact Errors

on:
  push:
    branches:
      - diag/lint-exact-errors-20261007

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev --no-audit --no-fund
      - name: Extract exact ESLint errors
        shell: bash
        run: |
          set +e
          npm run lint -- --format json > lint.json 2>&1
          code=$?
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('lint.json','utf8');
          const jsonStart = raw.indexOf('[{');
          if (jsonStart < 0) {
            console.log(raw);
            process.exit(0);
          }
          const parsed = JSON.parse(raw.slice(jsonStart));
          const errors = parsed.flatMap(file => (file.messages || [])
            .filter(m => m.severity === 2)
            .map(m => ({ file:file.filePath, line:m.line, column:m.column, rule:m.ruleId, message:m.message })));
          console.log(JSON.stringify({errorCount: errors.length, errors}, null, 2));
          NODE
          echo "ESLINT_EXIT=$code"
          exit $code
