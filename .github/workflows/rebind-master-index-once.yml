name: Rebind Master Index (one-time)

on:
  push:
    branches:
      - parallel/report-scope-tracing-20260910

permissions:
  contents: write

jobs:
  rebind:
    if: github.sha == 'a6e3a30c814dee9f1425fa9e204528a5bd49542a'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebind exact candidate and remove helper
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/MASTER_EXECUTION_INDEX.md')
          text = p.read_text(encoding='utf-8')
          old = 'Current code/test candidate: `a4bef11c7eea2ca2a5a453782d4671b93cf76a15`.'
          new = 'Current code/test candidate: `a6e3a30c814dee9f1425fa9e204528a5bd49542a`.'
          if old not in text:
              raise SystemExit('EXPECTED_INDEX_CANDIDATE_NOT_FOUND')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/rebind-master-index-once.yml').unlink()
      - name: Commit exact-head governance rebind
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/MASTER_EXECUTION_INDEX.md .github/workflows/rebind-master-index-once.yml
          git commit -m 'docs: bind master index to provenance repair candidate'
          git push origin HEAD:parallel/report-scope-tracing-20260910
