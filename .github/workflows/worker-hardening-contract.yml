name: Worker Hardening Contract

on:
  push:
    paths:
      - 'supabase/migrations/20260901040000_report_execution_worker_lifecycle.sql'
      - 'supabase/migrations/20260901030000_report_execution_worker_claim.sql'
      - 'src/lib/report-execution.ts'
      - 'scripts/check-worker-*-contract.mjs'
      - 'scripts/check-worker-lifecycle-guards.mjs'
      - 'scripts/report-execution-runtime.test.ts'
      - '.github/workflows/worker-hardening-contract.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260901040000_report_execution_worker_lifecycle.sql'
      - 'supabase/migrations/20260901030000_report_execution_worker_claim.sql'
      - 'src/lib/report-execution.ts'
      - 'scripts/check-worker-*-contract.mjs'
      - 'scripts/check-worker-lifecycle-guards.mjs'
      - 'scripts/report-execution-runtime.test.ts'
      - '.github/workflows/worker-hardening-contract.yml'

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker lifecycle guards
        run: node scripts/check-worker-lifecycle-guards.mjs
      - name: Search path contract
        run: node scripts/check-worker-search-path-contract.mjs
      - name: Lease floor contract
        run: node scripts/check-worker-lease-floor-contract.mjs
      - name: Null payload contract
        run: node scripts/check-worker-null-payload-contract.mjs
      - name: Lease clearance contract
        run: node scripts/check-worker-lease-clearance-contract.mjs
      - name: Execute grants contract
        run: node scripts/check-worker-execution-grants-contract.mjs
      - name: Claim lease contract
        run: node scripts/check-worker-claim-lease-contract.mjs
      - name: Checkpoint monotonicity contract
        run: node scripts/check-worker-checkpoint-monotonicity-contract.mjs
      - name: Retry eligibility contract
        run: node scripts/check-worker-retry-eligibility-contract.mjs
      - name: Terminality contract
        run: node scripts/check-worker-terminality-contract.mjs
      - name: Tenant boundary contract
        run: node scripts/check-worker-tenant-boundary-contract.mjs
