name: work-item-terminal-guard
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify terminal work-item transition guard
        run: node scripts/check-work-item-terminal-guard.mjs
      - name: Verify decision outcome terminal provenance
        run: node scripts/check-decision-outcome-actor-provenance.mjs && node scripts/check-outcome-provenance-identity.mjs
