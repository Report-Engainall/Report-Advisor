name: deep-truth-closure
on:
  pull_request:
    branches: [main]
  push:
    branches: ['wave/**']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: deep-truth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  truth-closure:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - name: Exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            expected_head="$(node -e "const fs=require('fs'); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')); process.stdout.write(e.pull_request.head.sha)")"
            actual_head="$(git ls-remote origin "refs/heads/${GITHUB_HEAD_REF}" | awk '{print $1}')"
            test -n "$actual_head"
            test "$actual_head" = "$expected_head"
            echo "PR_HEAD_SHA=$actual_head"
            echo "MERGE_REF_SHA=$GITHUB_SHA"
          else
            echo "CODE_HEAD_SHA=$(git rev-parse HEAD)"
          fi
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Canonical query alias closure
        run: node scripts/check-canonical-query-alias.mjs
      - name: Alternative-group tenant authority
        run: npm run test:alternative-group-tenant-authority
      - name: Inventory intelligence tenant authority
        run: node scripts/check-inventory-intelligence-tenant-authority.mjs
      - name: Profitability truth
        run: npm run test:profitability-truth
      - name: Receivables truth
        run: npm run test:receivables-aging-truth && node scripts/check-receivables-truth-contract.mjs
      - name: Financial aggregation consumers
        run: npm run test:financial-aggregation-consumers
      - name: Dashboard truth
        run: npm run test:dashboard-truth
      - name: Cross-surface truth contract
        run: node scripts/check-cross-surface-truth-contract.mjs
      - name: Cross-surface capability traceability
        run: node scripts/check-cross-surface-traceability.mjs
      - name: Semantic missing-to-zero sweep
        run: node scripts/check-semantic-truth-conversions.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
