name: Phase 11 E2E performance proof
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-phase11-e2e-performance-proof.mjs
      - run: npm run test:golden-e2e-corpus
      - run: npm run test:production-scale
      - run: npm run perf:budget
