name: Phase 12 release productization
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-phase12-release-productization-closure.mjs
      - run: npm run test:production-certification-evidence-integrity
      - run: npm run test:production-certification-contract
      - run: npm run test:release-evidence-consumption-workflow
      - run: npm run test:production-release-blockers
