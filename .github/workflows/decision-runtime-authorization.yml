name: decision-runtime-authorization

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**decision_runtime_authorization.sql'
      - 'scripts/check-decision-runtime-authorization.mjs'
      - '.github/workflows/decision-runtime-authorization.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**decision_runtime_authorization.sql'
      - 'scripts/check-decision-runtime-authorization.mjs'
      - '.github/workflows/decision-runtime-authorization.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Decision runtime authorization contract
        run: node scripts/check-decision-runtime-authorization.mjs
