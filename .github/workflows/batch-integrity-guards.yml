name: batch-integrity-guards
on:
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  guards:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Workflow integrity
        run: npm run test:workflow-batch-integrity
      - name: Import lifecycle integrity
        run: npm run test:import-state-contract
      - name: Canonical lifecycle mutation boundary
        run: node scripts/check-lifecycle-mutation-boundary.mjs
      - name: Decision link RPC boundary
        run: node scripts/check-decision-link-rpc-boundary.mjs
      - name: Worker lease fencing regression
        run: node --experimental-strip-types scripts/report-execution-lease-fencing.test.ts
      - name: Golden business corpus truth
        run: node scripts/business-golden-corpus-contract.mjs
