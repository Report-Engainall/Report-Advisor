name: batch-integrity-guards
on:
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name}}-${{ github.run_id}}
  cancel-in-progress: false
jobs:
  guards:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Workflow integrity
        run: npm run test:workflow-batch-integrity
      - name: Import lifecycle integrity
        run: npm run test:import-state-contract
      - name: Canonical lifecycle mutation boundary
        run: node scripts/check-lifecycle-mutation-boundary.mjs
      - name: Decision link RPC boundary
        run: node scripts/check-decision-link-rpc-boundary.mjs
      - name: Decision evidence authority
        run: node scripts/check-decision-evidence-authority.mjs
      - name: Receivables canonical truth
        run: node scripts/check-receivables-canonical-closure.mjs
      - name: Profitability financial truth
        run: node scripts/check-profitability-financial-truth.mjs
      - name: Queries compatibility consumer closure
        run: node scripts/check-queries-compat-consumers.mjs
      - name: Worker lease fencing regression
        run: node --experimental-strip-types scripts/report-execution-lease-fencing.test.ts
      - name: Golden business corpus truth
        run: node scripts/business-golden-corpus-contract.mjs
      - name: Canonical certification decision
        run: node scripts/check-canonical-certification-decision.mjs
