name: inventory-intelligence-truth
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: inventory-intelligence-truth-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Verify canonical inventory intelligence truth
        run: node scripts/check-inventory-intelligence-truth.mjs
