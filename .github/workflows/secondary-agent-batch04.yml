name: secondary-agent-batch04

on:
  push:
    branches:
      - parallel/secondary-agent-evidence-ux
  pull_request:
    branches:
      - phase-8-9-completion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secondary-agent-batch04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Golden Corpus contract harness
        run: npm run test:secondary-batch04-golden
      - name: Runtime and safety regression harness
        run: npm run test:secondary-batch04-regression
      - name: Batch 05 runtime closure audit
        run: npm run test:secondary-batch05-runtime-audit
      - name: Batch 06 quality audit
        run: node scripts/secondary-batch06-quality-audit.mjs
      - name: Batch 07 runtime gap inventory
        run: npm run test:secondary-batch07-runtime-inventory
      - name: Batch 07 safe surfaces regression
        run: npm run test:secondary-batch07-safe-surfaces
      - name: Batch 08 runtime readiness audit
        run: npm run test:secondary-batch08-runtime-readiness
      - name: Batch 08 contract guard
        run: node scripts/secondary-batch08-contract.test.mjs
      - name: Batch 09 boundary contract
        run: node scripts/secondary-batch09-boundary.test.mjs
      - name: Batch 10 contract
        run: node scripts/secondary-batch10-contract.mjs
      - name: Batch 11 safety contract
        run: node scripts/secondary-batch11-safety-contract.mjs
      - name: Batch 12 action-surface safety
        run: node scripts/secondary-batch12-action-surfaces.test.mjs
      - name: Batch 13 governance contract
        run: node scripts/secondary-batch13-governance.test.mjs
      - name: Batch 14 explainability contract
        run: node scripts/secondary-batch14-explainability.test.mjs
      - name: Batch 16 policy contract
        run: node scripts/secondary-batch16-policy.test.mjs
      - name: Free-first policy regression
        run: node scripts/secondary-free-first-policy.test.mjs
      - name: Batch 17 CI topology safety audit
        run: node scripts/secondary-batch17-ci-topology-audit.mjs

  project-quality:
    strategy:
      fail-fast: false
      matrix:
        check:
          - typecheck
          - lint
          - build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}
