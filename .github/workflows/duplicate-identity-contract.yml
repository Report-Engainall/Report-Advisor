name: Canonical Duplicate Identity Contract

on:
  pull_request:
    paths:
      - 'src/lib/file-engine/security.ts'
      - 'src/lib/file-engine/business-key.ts'
      - 'src/lib/file-engine/reconciliation.ts'
      - 'src/lib/import/canonical-truth-boundary.ts'
      - 'src/lib/import/canonical-production-adapter.ts'
      - 'scripts/check-business-key-regressions.mjs'
      - 'scripts/business-key-runtime-parity.mjs'
      - 'scripts/check-duplicate-identity-contract.mjs'
      - '.github/workflows/duplicate-identity-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duplicate-identity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate canonical duplicate identity boundary
        run: node scripts/check-duplicate-identity-contract.mjs
      - name: Validate single business-key contract
        run: node scripts/check-business-key-regressions.mjs
      - name: Validate business-key runtime parity
        env:
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/business-key-runtime-parity.mjs
