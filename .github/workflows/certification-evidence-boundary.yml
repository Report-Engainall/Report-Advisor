name: certification-evidence-boundary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify certification evidence write boundary
        run: node scripts/check-certification-evidence-write-boundary.mjs
      - name: Verify certification completeness boundary
        run: node scripts/check-production-certification-adversarial.mjs
      - name: Verify certification evidence order
        run: node scripts/check-certification-evidence-order-contract.mjs
      - name: Verify certification score derivation
        run: node scripts/check-certification-score-contract.mjs
      - name: Verify certification fail-closed decision
        run: node scripts/check-certification-fail-closed-contract.mjs
      - name: Verify certification duplicate evidence handling
        run: node scripts/check-certification-duplicate-contract.mjs
      - name: Verify certification missing/failed evidence handling
        run: node scripts/check-certification-missing-failed-contract.mjs
      - name: Verify queue immutability boundary
        run: node scripts/check-report-queue-immutability.mjs
      - name: Verify queue gate test-of-test
        run: node scripts/check-report-queue-immutability-test-of-test.mjs
