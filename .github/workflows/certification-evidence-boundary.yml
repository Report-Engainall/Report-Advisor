name: certification-evidence-boundary
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact PR head when triggered by pull request
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          ACTUAL_HEAD="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test -n "$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify certification evidence write boundary
        run: node scripts/check-certification-evidence-write-boundary.mjs
      - name: Verify certification completeness boundary
        run: node scripts/check-production-certification-adversarial.mjs
      - name: Verify queue immutability boundary
        run: node scripts/check-report-queue-immutability.mjs
      - name: Verify queue gate test-of-test
        run: node scripts/check-report-queue-immutability-test-of-test.mjs
