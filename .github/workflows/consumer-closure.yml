name: consumer-closure
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: consumer-closure-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  canonical-boundaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - name: Exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Compatibility consumer closure
        run: npm run test:compatibility-consumer-closure
      - name: Report queue reliability closure
        run: npm run test:report-queue-reliability
