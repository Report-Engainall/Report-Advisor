name: Import Query Bounds

on:
  pull_request:
    paths:
      - 'src/lib/queries.ts'
      - 'scripts/check-import-query-bounds.mjs'
      - '.github/workflows/import-query-bounds.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/queries.ts'
      - 'scripts/check-import-query-bounds.mjs'
      - '.github/workflows/import-query-bounds.yml'

jobs:
  import-query-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify bounded import history
        run: node scripts/check-import-query-bounds.mjs
