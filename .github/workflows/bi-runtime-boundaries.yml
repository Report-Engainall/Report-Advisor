name: BI Runtime Boundaries
on:
  pull_request:

permissions:
  contents: read

jobs:
  bi-runtime-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run BI runtime boundary contract
        run: node scripts/check-bi-runtime-boundaries.mjs
