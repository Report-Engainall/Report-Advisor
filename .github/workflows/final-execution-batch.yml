name: Final Execution Batch
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  final-execution-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Execute 30 deterministic gates
        run: node scripts/check-final-execution-batch.mjs
