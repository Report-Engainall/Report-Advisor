name: recovery-readiness
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$actual"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Static recovery readiness
        run: node scripts/check-recovery-readiness.mjs
      - name: Phase F runtime closure contract
        run: npm run test:phase-f-runtime-closure
      - name: Operational resilience contract
        run: npm run test:operational-resilience
      - name: Release resilience manifest
        run: npm run test:release-resilience-manifest
      - name: Continuous trust contract
        run: npm run test:continuous-trust
