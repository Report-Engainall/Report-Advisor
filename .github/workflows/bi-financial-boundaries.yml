name: BI Financial Boundaries

on:
  pull_request:
    paths:
      - 'src/lib/businessIntelligenceEngines.ts'
      - 'src/lib/bi-financial-boundary-contract.test.ts'
      - 'scripts/check-bi-financial-boundaries.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bi-financial-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-boundaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute financial boundary contract
        run: node scripts/check-bi-financial-boundaries.mjs
