name: UI route completeness

on:
  pull_request:
    paths:
      - 'src/App.tsx'
      - 'src/components/Sidebar.tsx'
      - 'src/pages/**'
      - 'scripts/check-ui-route-completeness.mjs'
      - '.github/workflows/ui-route-completeness.yml'
  push:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/components/Sidebar.tsx'
      - 'src/pages/**'
      - 'scripts/check-ui-route-completeness.mjs'
      - '.github/workflows/ui-route-completeness.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-ui-route-completeness.mjs
