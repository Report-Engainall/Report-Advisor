name: real-report-contract

on:
  pull_request:

jobs:
  real-report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/golden-e2e-corpus.test.mjs
      - run: node scripts/real-report-business-wrapper.test.mjs
      - run: node scripts/real-report-truth-matrix.mjs