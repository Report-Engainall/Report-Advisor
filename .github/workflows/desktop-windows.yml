name: desktop-windows
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Build web application
        run: npm run build
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Native watcher contract
        run: node scripts/check-windows-desktop-folder-watch-contract.mjs
      - name: Native runtime smoke
        shell: pwsh
        run: |
          npm --prefix desktop run smoke:native *>&1 | Tee-Object desktop/native-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-native-smoke-diagnostics
          path: desktop/native-smoke.log
          if-no-files-found: warn
      - name: Package Windows installer
        run: npm --prefix desktop run package:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error
