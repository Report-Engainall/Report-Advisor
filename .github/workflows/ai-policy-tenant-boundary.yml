name: AI Policy Tenant Boundary
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tenant-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tenant boundary tests
        run: node scripts/check-ai-policy-tenant-boundaries.mjs
