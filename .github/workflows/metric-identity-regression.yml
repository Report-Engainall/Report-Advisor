name: metric-identity-regression

on:
  pull_request:
    paths:
      - 'src/lib/semanticMetrics.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/metricEngine.ts'
      - 'scripts/check-metric-identity-resolver.mjs'
  push:
    branches: [main]
    paths:
      - 'src/lib/semanticMetrics.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/metricEngine.ts'
      - 'scripts/check-metric-identity-resolver.mjs'

permissions:
  contents: read

concurrency:
  group: metric-identity-regression-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Metric identity resolver
        run: node scripts/check-metric-identity-resolver.mjs
      - name: Semantic metric registry
        run: node scripts/check-semantic-metric-registry.mjs
      - name: Typecheck
        run: npm run typecheck
