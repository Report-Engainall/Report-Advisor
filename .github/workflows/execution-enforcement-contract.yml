name: Execution Enforcement Contract
on:
  push:
    paths:
      - 'docs/EXECUTION_ENFORCEMENT_PROTOCOL.md'
      - 'docs/ADAPTIVE_EXECUTION_GOVERNANCE.md'
      - 'docs/EXECUTION_PERFORMANCE_LEDGER.md'
      - 'docs/EXECUTION_DEBT_AND_RELEASE_VELOCITY.md'
      - 'docs/MASTER_EXECUTION_INDEX.md'
      - 'scripts/check-execution-enforcement-protocol.mjs'
      - 'scripts/execution-enforcement-adversarial.test.mjs'
      - '.github/workflows/execution-enforcement-contract.yml'
  pull_request:
    paths:
      - 'docs/EXECUTION_ENFORCEMENT_PROTOCOL.md'
      - 'docs/ADAPTIVE_EXECUTION_GOVERNANCE.md'
      - 'docs/EXECUTION_PERFORMANCE_LEDGER.md'
      - 'docs/EXECUTION_DEBT_AND_RELEASE_VELOCITY.md'
      - 'docs/MASTER_EXECUTION_INDEX.md'
      - 'scripts/check-execution-enforcement-protocol.mjs'
      - 'scripts/execution-enforcement-adversarial.test.mjs'
      - '.github/workflows/execution-enforcement-contract.yml'
  workflow_dispatch:

jobs:
  enforcement-contract:
    runs-on: ubuntu-latest
    env:
      ENFORCE_INDEX_HEAD_GATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify execution enforcement contract
        run: node scripts/check-execution-enforcement-protocol.mjs
      - name: Run enforcement adversarial test-of-test suite
        run: node scripts/execution-enforcement-adversarial.test.mjs
