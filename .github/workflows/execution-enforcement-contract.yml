name: Execution Enforcement Contract
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforcement-contract:
    runs-on: ubuntu-latest
    env:
      ENFORCE_INDEX_HEAD_GATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify certification boundary integrity
        if: ${{ (github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'commercial/')) || (github.event_name != 'pull_request' && !startsWith(github.ref_name, 'commercial/')) }}
        run: node scripts/check-certification-boundary-integrity.mjs
      - name: Verify execution enforcement contract
        run: node scripts/check-execution-enforcement-protocol.mjs
      - name: Run enforcement adversarial test-of-test suite
        run: node scripts/execution-enforcement-adversarial.test.mjs
      - name: Verify repository-wide query export coverage
        run: node scripts/check-query-export-coverage.mjs
      - name: Run certification boundary test-of-test suite
        run: node scripts/check-certification-boundary-integrity.test.mjs
  real-report-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"
          test -z "$(git status --porcelain)"
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Install native OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng


      - name: Run embedded PDF font recovery regression
        run: node scripts/check-pdf-embedded-font-recovery.mjs

      - name: Normalize and execute real report corpus
        shell: bash
        env:
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
          RESUME_RUN_ID: '36602376973'
          RESUME_FROM_PATH: 'tests/fixtures/realistic-reports/الصراف الحوشبي.pdf'
          REAL_REPORT_CORPUS_ROOT: tests/fixtures/realistic-reports
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.REPORT_ADVISOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/real-report-corpus-e2e.mjs
      - name: Upload real report corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-real-report-corpus-${{ env.EXACT_HEAD }}
          path: artifacts/real-report-corpus
          if-no-files-found: warn
          retention-days: 14

  pdf-jib-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Diagnose Jib PDF
        shell: bash
        run: |
          set -euo pipefail
          FILE='tests/fixtures/realistic-reports/الصراف جيب.pdf'
          pdfinfo "$FILE" | sed -n '1,40p'
          echo '--- PDF TEXT ---'
          pdftotext -layout "$FILE" - | sed -n '1,220p'
          echo '--- OCR PAGE 1 ---'
          pdftoppm -f 1 -singlefile -png -r 180 "$FILE" /tmp/jib-page
          tesseract /tmp/jib-page.png stdout -l ara+eng --psm 6 | sed -n '1,220p'

  pdf-jib-canonical-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Execute canonical PDF parser
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const { parseFile } = await import('./src/lib/file-engine/adapters.ts');
          const file='tests/fixtures/realistic-reports/الصراف جيب.pdf';
          const bytes=await fs.readFile(file);
          const datasets=await parseFile(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),file,'pdf');
          console.log(JSON.stringify(datasets.map(dataset=>({
            rows:dataset.rowCount,
            columns:dataset.columnCount,
            quality:dataset.qualityScore,
            source:dataset.source,
            columns_profile:dataset.columns.map(column=>({name:column.name,mappedField:column.mappedField,confidence:column.mappingConfidence,issues:column.qualityIssues})),
            sample:dataset.rows.slice(0,8)
          })),null,2));
          NODE

  pdf-exchange-houses-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Diagnose exchange-house PDF
        shell: bash
        run: |
          set -euo pipefail
          FILE='tests/fixtures/realistic-reports/الصرافين.pdf'
          pdfinfo "$FILE" | sed -n '1,40p'
          echo '--- PDF TEXT ---'
          pdftotext -layout "$FILE" - | sed -n '1,180p'
          echo '--- OCR PAGE 1 ---'
          pdftoppm -f 1 -singlefile -png -r 180 "$FILE" /tmp/exchange-houses-page
          tesseract /tmp/exchange-houses-page.png stdout -l ara+eng --psm 6 | sed -n '1,180p'
      - name: Execute canonical parser
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const { parseFile } = await import('./src/lib/file-engine/adapters.ts');
          const file='tests/fixtures/realistic-reports/الصرافين.pdf';
          const bytes=await fs.readFile(file);
          const datasets=await parseFile(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength),file,'pdf');
          console.log(JSON.stringify(datasets.map(dataset=>({
            rows:dataset.rowCount,
            columns:dataset.columnCount,
            quality:dataset.qualityScore,
            source:dataset.source,
            columns_profile:dataset.columns.map(column=>({name:column.name,mappedField:column.mappedField,confidence:column.mappingConfidence,issues:column.qualityIssues})),
            sample:dataset.rows.slice(0,8)
          })),null,2));
          NODE

