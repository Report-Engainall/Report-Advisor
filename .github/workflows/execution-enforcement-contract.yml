name: Execution Enforcement Contract
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforcement-contract:
    runs-on: ubuntu-latest
    env:
      ENFORCE_INDEX_HEAD_GATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify certification boundary integrity
        if: ${{ (github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'commercial/')) || (github.event_name != 'pull_request' && !startsWith(github.ref_name, 'commercial/')) }}
        run: node scripts/check-certification-boundary-integrity.mjs
      - name: Verify execution enforcement contract
        run: node scripts/check-execution-enforcement-protocol.mjs
      - name: Run enforcement adversarial test-of-test suite
        run: node scripts/execution-enforcement-adversarial.test.mjs
      - name: Verify repository-wide query export coverage
        run: node scripts/check-query-export-coverage.mjs
      - name: Run certification boundary test-of-test suite
        run: node scripts/check-certification-boundary-integrity.test.mjs

  real-report-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"
          test -z "$(git status --porcelain)"
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Install native OCR runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - name: Run embedded PDF font recovery regression
        run: node scripts/check-pdf-embedded-font-recovery.mjs
      - name: Normalize and execute real report corpus
        shell: bash
        env:
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
          RESUME_RUN_ID: '36602376973'
          RESUME_FROM_PATH: 'tests/fixtures/realistic-reports/الصراف الحوشبي.pdf'
          REAL_REPORT_CORPUS_ROOT: tests/fixtures/realistic-reports
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.REPORT_ADVISOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/real-report-corpus-e2e.mjs
      - name: Upload real report corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-real-report-corpus-${{ env.EXACT_HEAD }}
          path: artifacts/real-report-corpus
          if-no-files-found: warn
          retention-days: 14
  report23-extractor-diagnostic:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Inspect PDF table extractor
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          if(!('DOMMatrix' in globalThis)) Object.defineProperty(globalThis,'DOMMatrix',{configurable:true,value:class DOMMatrix{}});
          if(!('sumPrecise' in Math)) Object.defineProperty(Math,'sumPrecise',{configurable:true,writable:true,value:(values)=>{let total=0;for(const value of values)total+=Number(value)||0;return total;}});
          if(!('try' in Promise)) Object.defineProperty(Promise,'try',{configurable:true,writable:true,value:(fn,...args)=>new Promise((resolve,reject)=>{try{resolve(fn(...args));}catch(error){reject(error);}})});
          if(!('toHex' in Uint8Array.prototype)) Object.defineProperty(Uint8Array.prototype,'toHex',{configurable:true,writable:true,value:function(){return Array.from(this,(byte)=>byte.toString(16).padStart(2,'0')).join('');}});
          const { extractPdfTableRowsFromTextItems } = await import('./src/lib/file-engine/adapters.ts');
          const pdfjs=await import('pdfjs-dist');
          const file='tests/fixtures/realistic-reports/تقارير ادارية للمورد.pdf';
          const bytes=await fs.readFile(file);
          const buffer=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
          const pdfBuffer=buffer.slice(0);
          const pdf=await pdfjs.getDocument({data:new Uint8Array(pdfBuffer),useSystemFonts:true}).promise;
          const items=[];
          for(let pageNumber=1;pageNumber<=pdf.numPages;pageNumber++){
            const page=await pdf.getPage(pageNumber);
            const content=await page.getTextContent({disableCombineTextItems:true});
            items.push(...content.items.map(item=>({str:item.str,x:Number(item.transform?.[4]),y:Number(item.transform?.[5]),width:Number(item.width)||0,page:pageNumber})).filter(item=>item.str&&Number.isFinite(item.x)&&Number.isFinite(item.y)));
          }
          const result=extractPdfTableRowsFromTextItems(items,null);
          console.log(JSON.stringify({items:items.length,header:result.header,rows:result.rows.length,sample:result.rows.slice(0,3)},null,2));
          NODE

