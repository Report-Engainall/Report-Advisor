name: Execution Enforcement Contract
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforcement-contract:
    runs-on: ubuntu-latest
    env:
      ENFORCE_INDEX_HEAD_GATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify certification boundary integrity
        if: ${{ (github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'commercial/')) || (github.event_name != 'pull_request' && !startsWith(github.ref_name, 'commercial/')) }}
        run: node scripts/check-certification-boundary-integrity.mjs
      - name: Verify execution enforcement contract
        run: node scripts/check-execution-enforcement-protocol.mjs
      - name: Run enforcement adversarial test-of-test suite
        run: node scripts/execution-enforcement-adversarial.test.mjs
      - name: Verify repository-wide query export coverage
        run: node scripts/check-query-export-coverage.mjs
      - name: Run certification boundary test-of-test suite
        run: node scripts/check-certification-boundary-integrity.test.mjs
  real-report-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"
          test -z "$(git status --porcelain)"
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Inspect first real PDF through canonical file engine
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/debug-real-pdf.mjs <<'EOF'
          import fs from 'node:fs/promises';
          const { parseFile } = await import(process.cwd() + '/src/lib/file-engine/adapters.ts');
          const { understandCanonicalSource } = await import(process.cwd() + '/src/lib/import/canonical-source-understanding.ts');
          const fileName = 'اعمار الديون للعملا.pdf';
          const bytes = await fs.readFile('tests/fixtures/realistic-reports/' + fileName);
          const buffer = bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength);
          const datasets = await parseFile(buffer, fileName, 'pdf');
          const understanding = understandCanonicalSource(datasets);
          console.log(JSON.stringify({
            dataset_count: datasets.length,
            datasets: datasets.map(dataset => ({ name: dataset.name, rowCount: dataset.rowCount, columnCount: dataset.columnCount, qualityScore: dataset.qualityScore, columns: dataset.columns.map(column => ({name:column.name,mappedField:column.mappedField,mappingConfidence:column.mappingConfidence})), sample: dataset.rows.slice(0,3) })),
            understanding: { rowCount: understanding.rowCount, columnCount: understanding.columnCount, qualityScore: understanding.qualityScore, specialty: understanding.specialty, specialtyConfidence: understanding.specialtyConfidence, entityType: understanding.entityType, sample: understanding.rows.slice(0,3) }
          }, null, 2));
          EOF
          node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs /tmp/debug-real-pdf.mjs
      - name: Normalize and execute real report corpus
        shell: bash
        env:
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
          REAL_REPORT_CORPUS_ROOT: tests/fixtures/realistic-reports
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.REPORT_ADVISOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/real-report-corpus-e2e.mjs')
          s=p.read_text()
          s=s.replace('const source=fingerprinted=await fingerprint(file);','const source=await fingerprint(file);')
          # The source declaration is the only normalization required; later references already use `source`.
          p.write_text(s)
          PY
          node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/real-report-corpus-e2e.mjs
      - name: Upload real report corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-real-report-corpus-${{ env.EXACT_HEAD }}
          path: artifacts/real-report-corpus
          if-no-files-found: warn
          retention-days: 14
