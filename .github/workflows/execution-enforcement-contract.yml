name: Execution Enforcement Contract
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforcement-contract:
    runs-on: ubuntu-latest
    env:
      ENFORCE_INDEX_HEAD_GATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify certification boundary integrity
        if: ${{ (github.event_name == 'pull_request' && !startsWith(github.event.pull_request.head.ref, 'commercial/')) || (github.event_name != 'pull_request' && !startsWith(github.ref_name, 'commercial/')) }}
        run: node scripts/check-certification-boundary-integrity.mjs
      - name: Verify execution enforcement contract
        run: node scripts/check-execution-enforcement-protocol.mjs
      - name: Run enforcement adversarial test-of-test suite
        run: node scripts/execution-enforcement-adversarial.test.mjs
      - name: Verify repository-wide query export coverage
        run: node scripts/check-query-export-coverage.mjs
      - name: Run certification boundary test-of-test suite
        run: node scripts/check-certification-boundary-integrity.test.mjs
  real-report-corpus:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXACT_HEAD}"
          test -z "$(git status --porcelain)"
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund

      - name: Inspect blocked Aamery statement PDF geometry
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          if (!('DOMMatrix' in globalThis)) Object.defineProperty(globalThis, 'DOMMatrix', { configurable: true, value: class DOMMatrix {} });
          if (!('sumPrecise' in Math)) Object.defineProperty(Math, 'sumPrecise', { configurable: true, value: (values) => { let total = 0; for (const value of values) total += Number(value) || 0; return total; } });
          if (!('try' in Promise)) Object.defineProperty(Promise, 'try', { configurable: true, value: (fn, ...args) => new Promise((resolve, reject) => { try { resolve(fn(...args)); } catch (error) { reject(error); } }) });
          if (!('toHex' in Uint8Array.prototype)) Object.defineProperty(Uint8Array.prototype, 'toHex', { configurable: true, value: function() { return Array.from(this, (byte) => byte.toString(16).padStart(2, '0')).join(''); } });
          const pdfjs = await import('file://' + process.cwd() + '/node_modules/pdfjs-dist/build/pdf.mjs');
          const file='tests/fixtures/realistic-reports/الصراف العامري.pdf';
          const bytes=await fs.readFile(file);
          const buffer=bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength);
          const pdf=await pdfjs.getDocument({data:new Uint8Array(buffer),useSystemFonts:true}).promise;
          console.log('AAMERY_PAGES='+pdf.numPages);
          for(let pageNumber=1;pageNumber<=Math.min(2,pdf.numPages);pageNumber++){
            const page=await pdf.getPage(pageNumber);
            const content=await page.getTextContent({disableCombineTextItems:true});
            const items=content.items.map(item=>({str:'str' in item?String(item.str||''):'',x:item.transform?.[4],y:item.transform?.[5],width:item.width})).filter(i=>i.str.trim()&&Number.isFinite(i.x)&&Number.isFinite(i.y));
            const lines=[];
            for(const item of items.sort((a,b)=>b.y-a.y||a.x-b.x)){ const last=lines[lines.length-1]; if(!last||Math.abs(last.y-item.y)>4) lines.push({y:item.y,items:[item]}); else last.items.push(item); }
            console.log('PAGE='+pageNumber+' ITEM_COUNT='+items.length);
            for(const line of lines.slice(0,24)){ console.log('LINE '+line.y.toFixed(2)+' :: '+line.items.map(i=>i.str).join(' | ')); }
          }
          NODE
      - name: Normalize and execute real report corpus
        shell: bash
        env:
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
          RESUME_RUN_ID: '36602376973'
          RESUME_FROM_PATH: 'tests/fixtures/realistic-reports/الصراف الحوشبي.pdf'
          REAL_REPORT_CORPUS_ROOT: tests/fixtures/realistic-reports
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.REPORT_ADVISOR_SUPABASE_SERVICE_ROLE_KEY }}
        run: node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/real-report-corpus-e2e.mjs
      - name: Upload real report corpus evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-real-report-corpus-${{ env.EXACT_HEAD }}
          path: artifacts/real-report-corpus
          if-no-files-found: warn
          retention-days: 14

# Corpus execution uses only the committed canonical runner; browser/device are not dependencies.
