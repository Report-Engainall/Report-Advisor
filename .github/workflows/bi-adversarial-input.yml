name: BI Adversarial Input

on:
  pull_request:
    paths:
      - 'src/lib/businessIntelligenceEngines.ts'
      - 'src/lib/bi-adversarial-input-contract.test.ts'
      - 'scripts/check-bi-adversarial-input-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bi-adversarial-input.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-input:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute adversarial input contract
        run: npm run test:bi-adversarial-input
