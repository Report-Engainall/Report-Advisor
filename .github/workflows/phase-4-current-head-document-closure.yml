name: Phase 4 current-head document intelligence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact HEAD
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Closure gate
        run: npm run test:phase4-document-closure
      - name: Existing document hardening regression
        run: npm run test:document-intelligence-hardening
      - name: Service tests
        env:
          PYTHONPATH: services/document-intelligence
        run: python -m unittest discover -s services/document-intelligence/tests -p 'test_*.py'
