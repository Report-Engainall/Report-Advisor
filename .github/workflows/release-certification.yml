name: release-certification
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      stabilization_seconds:
        description: Post-deploy stabilization evidence window
        required: true
        default: '60'
        type: string
  push:
    tags: ['v*']
permissions: {contents: read}
concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify Exact SHA Guard
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Actual SHA: $actual_sha"
          echo "Expected SHA (GITHUB_SHA): $GITHUB_SHA"
          if [ "$actual_sha" != "$GITHUB_SHA" ]; then
            echo "❌ ERROR: SHA mismatch! Aborting certification."
            exit 1
          fi
          echo "✅ SHA verified successfully."

      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preflight contracts
        run: npm run typecheck && npm run lint && npm run build && npm run test:production-release-blockers && npm run test:production-readiness && npm run test:operational-resilience && npm run test:release-resilience-manifest && node scripts/check-release-evidence-contract.mjs && node scripts/check-release-evidence-completeness.mjs
      - name: Validate production regression evidence input
        shell: bash
        run: |
          set -euo pipefail
          test -s release-evidence/production-regression-results.json
          node -e "const fs=require('node:fs'); const p='release-evidence/production-regression-results.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); if(!x || Array.isArray(x) || typeof x!=='object') throw new Error('production regression evidence must be an object keyed by scenario id');"
      - name: Create reproducible release evidence and certification decision
        shell: bash
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          RELEASE_STABILIZATION_SECONDS: ${{ inputs.stabilization_seconds || '60' }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const source_sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const ref = process.env.GITHUB_REF;
          const environment = process.env.RELEASE_ENVIRONMENT;
          const certification_run_id = process.env.GITHUB_RUN_ID;
          const stabilization_seconds = Number(process.env.RELEASE_STABILIZATION_SECONDS);
          if (!Number.isInteger(stabilization_seconds) || stabilization_seconds < 0) throw new Error('Invalid stabilization window');
          const migrations_fingerprint = execFileSync('bash', ['-lc', "find supabase/migrations -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1"], {encoding: 'utf8'}).trim();
          const dependency_lock_fingerprint = execFileSync('sha256sum', ['package-lock.json'], {encoding: 'utf8'}).trim().split(/\s+/)[0];
          const artifact_fingerprint = execFileSync('bash', ['-lc', "find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1"], {encoding: 'utf8'}).trim();
          const payload = {
            schema_version: 1,
            release_key: ref,
            source_sha,
            certification_run_id,
            migrations_fingerprint,
            dependency_lock_fingerprint,
            artifact_fingerprint,
            environment,
            stabilization_seconds,
            evidence_contracts: {
              release_evidence: 'validated',
              production_certification: 'validated',
              production_release_blockers: 'validated',
              trust: 'validated',
              canary: 'validated',
              rollback: 'validated',
              fail_closed: 'validated'
            }
          };
          const manifest_id = crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          const manifest = {...payload, manifest_id, generated_at: new Date().toISOString()};
          fs.writeFileSync('release-evidence/manifest.json', JSON.stringify(manifest, null, 2) + '\n');

          const { spawnSync } = require('node:child_process');
          const decisionRun = spawnSync(process.execPath, ['scripts/production-release-decision.mjs', 'release-evidence/production-regression-results.json'], {encoding: 'utf8'});
          if (decisionRun.error) throw decisionRun.error;
          if (!decisionRun.stdout.trim()) throw new Error('evaluateRelease produced no decision JSON');
          const decision = JSON.parse(decisionRun.stdout.trim().split('\n').at(-1));
          if (!['approved', 'blocked'].includes(decision.release)) throw new Error(`Invalid release decision: ${decision.release}`);
          const blocker_count = decision.failures.length;
          const certification = {
            schema_version: 1,
            certification_decision_id: crypto.randomUUID(),
            consumed_release_manifest_id: manifest_id,
            consumed_source_sha: source_sha,
            certification_run_id,
            certification_result: decision.release === 'approved' ? 'passed' : 'blocked',
            blocker_count,
            blocker_state: blocker_count === 0 ? 'clear' : 'blocked',
            release_decision: decision,
            identity: {
              source_sha_matches_manifest: source_sha === manifest.source_sha,
              manifest_id_matches_payload: manifest_id === manifest.manifest_id,
              certification_run_id_matches_manifest: certification_run_id === manifest.certification_run_id,
              ref,
              environment
            },
            required_contracts: manifest.evidence_contracts,
            decided_at: new Date().toISOString()
          };
          fs.writeFileSync('release-evidence/certification-decision.json', JSON.stringify(certification, null, 2) + '\n');
          fs.writeFileSync('release-evidence/manifest.env', [
            `manifest_id=${manifest_id}`,
            `source_sha=${source_sha}`,
            `certification_run_id=${certification_run_id}`,
            `ref=${ref}`,
            `environment=${environment}`,
            `migrations_fingerprint=${migrations_fingerprint}`,
            `dependency_lock_fingerprint=${dependency_lock_fingerprint}`,
            `artifact_fingerprint=${artifact_fingerprint}`,
            `generated_at=${manifest.generated_at}`
          ].join('\n') + '\n');
          console.log(JSON.stringify({release: decision.release, blocker_count, failures: decision.failures}));
          if (decision.release !== 'approved') process.exit(1);
          NODE
          cat release-evidence/manifest.json
          cat release-evidence/certification-decision.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
