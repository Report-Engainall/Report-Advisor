name: release-certification
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      stabilization_seconds:
        description: Post-deploy stabilization evidence window
        required: true
        default: '60'
        type: string
  push:
    tags: ['v*']
permissions: {contents: read}
concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify exact release ref
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Preflight contracts
        run: npm run typecheck && npm run lint && npm run build && npm run test:production-release-blockers && npm run test:production-readiness && npm run test:operational-resilience && npm run test:release-resilience-manifest && node scripts/check-release-evidence-contract.mjs && node scripts/check-release-evidence-completeness.mjs && node scripts/check-production-certification-contract.mjs && node scripts/certification-consumer-antiforgery.test.mjs && node scripts/canonical-certification-decision.test.mjs
      - name: Create reproducible release evidence and fail-closed certification decision
        shell: bash
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          RELEASE_STABILIZATION_SECONDS: ${{ inputs.stabilization_seconds || '60' }}
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const source_sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const expected_sha = process.env.GITHUB_SHA;
          if (source_sha !== expected_sha) throw new Error(`EXACT_HEAD_MISMATCH:${source_sha}:${expected_sha}`);
          const ref = process.env.GITHUB_REF;
          const environment = process.env.RELEASE_ENVIRONMENT;
          const certification_run_id = process.env.GITHUB_RUN_ID;
          const stabilization_seconds = Number(process.env.RELEASE_STABILIZATION_SECONDS);
          if (!Number.isInteger(stabilization_seconds) || stabilization_seconds < 0) throw new Error('Invalid stabilization window');
          const migrations_fingerprint = execFileSync('bash', ['-lc', "find supabase/migrations -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1"], {encoding: 'utf8'}).trim();
          const dependency_lock_fingerprint = execFileSync('sha256sum', ['package-lock.json'], {encoding: 'utf8'}).trim().split(/\s+/)[0];
          const artifact_fingerprint = execFileSync('bash', ['-lc', "find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1"], {encoding: 'utf8'}).trim();

          const required = ['tenant','backup','rollback','artifact','security'];
          const blockers = required.map(key => `MISSING_RUNTIME_EVIDENCE:${key}`);
          const evidence_contracts = Object.fromEntries(required.map(key => [key, 'missing']));
          const payload = {
            schema_version: 2,
            release_key: ref,
            source_sha,
            certification_run_id,
            migrations_fingerprint,
            dependency_lock_fingerprint,
            artifact_fingerprint,
            environment,
            stabilization_seconds,
            evidence_contracts,
          };
          const manifest_id = crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          const generated_at = new Date().toISOString();
          const manifest = {...payload, manifest_id, generated_at};
          const certification = {
            schema_version: 2,
            certification_decision_id: crypto.randomUUID(),
            consumed_release_manifest_id: manifest_id,
            consumed_source_sha: source_sha,
            certification_run_id,
            certification_result: 'blocked',
            blocker_count: blockers.length,
            blocker_state: 'blocked',
            identity: {
              source_sha_matches_manifest: true,
              manifest_id_matches_payload: true,
              certification_run_id_matches_manifest: true,
              ref,
              environment,
            },
            required_contracts: evidence_contracts,
            blockers,
            decided_at: generated_at,
          };

          fs.writeFileSync('release-evidence/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync('release-evidence/certification-decision.json', JSON.stringify(certification, null, 2) + '\n');
          fs.writeFileSync('release-evidence/manifest.env', [
            `manifest_id=${manifest_id}`,
            `source_sha=${source_sha}`,
            `certification_run_id=${certification_run_id}`,
            `ref=${ref}`,
            `environment=${environment}`,
            `migrations_fingerprint=${migrations_fingerprint}`,
            `dependency_lock_fingerprint=${dependency_lock_fingerprint}`,
            `artifact_fingerprint=${artifact_fingerprint}`,
            `generated_at=${generated_at}`,
            `certification_result=blocked`,
            `blocker_count=${blockers.length}`,
          ].join('\n') + '\n');
          NODE
          cat release-evidence/manifest.json
          cat release-evidence/certification-decision.json
      - name: Reject release certification until canonical runtime evidence is consumed
        run: |
          echo 'PRODUCTION CERTIFICATION: BLOCKED — runtime tenant/backup/rollback/artifact/security evidence is not yet consumed by this workflow.'
          exit 1
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
