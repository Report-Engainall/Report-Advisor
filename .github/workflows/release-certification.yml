name: release-certification
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      stabilization_seconds:
        description: Post-deploy stabilization evidence window
        required: true
        default: '60'
        type: string
  push:
    tags: ['v*']
permissions: {contents: read}
concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preflight contracts
        run: npm run typecheck && npm run lint && npm run build && npm run test:production-release-blockers && npm run test:production-readiness && npm run test:operational-resilience && npm run test:release-resilience-manifest && node scripts/check-release-evidence-contract.mjs
      - name: Create reproducible release evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          printf '%s\n' "source_sha=$(git rev-parse HEAD)" > release-evidence/manifest.env
          printf '%s\n' "ref=${GITHUB_REF}" >> release-evidence/manifest.env
          printf '%s\n' "environment=${{ inputs.environment || 'staging' }}" >> release-evidence/manifest.env
          printf '%s\n' "migrations_fingerprint=$(find supabase/migrations -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> release-evidence/manifest.env
          printf '%s\n' "dependency_lock_fingerprint=$(sha256sum package-lock.json | cut -d' ' -f1)" >> release-evidence/manifest.env
          printf '%s\n' "artifact_fingerprint=$(find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)" >> release-evidence/manifest.env
          printf '%s\n' "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> release-evidence/manifest.env
          cat release-evidence/manifest.env
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-release-evidence-${{ github.sha }}
          path: release-evidence/manifest.env
          if-no-files-found: error
          retention-days: 30
