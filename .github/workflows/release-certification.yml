name: release-certification
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      stabilization_seconds:
        description: Post-deploy stabilization evidence window
        required: true
        default: '60'
        type: string
  push:
    tags: ['v*']
permissions: {contents: read}
concurrency:
  group: release-certification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Preflight contracts
        run: npm run typecheck && npm run lint && npm run build && npm run test:production-release-blockers && npm run test:production-readiness && npm run test:operational-resilience && npm run test:release-resilience-manifest && node scripts/check-release-evidence-contract.mjs && node scripts/check-release-evidence-completeness.mjs
      - name: Produce executable production regression evidence
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA" ]] || { echo "SOURCE_SHA_MISMATCH:$actual_sha:$EXPECTED_SOURCE_SHA"; exit 1; }
          node scripts/produce-production-regression-evidence.mjs
      - name: Require real production regression evidence
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -s release-evidence/production-regression-results.json || { echo 'PRODUCTION_REGRESSION_RESULTS_MISSING'; exit 1; }
          node scripts/production-release-decision.mjs \
            --results release-evidence/production-regression-results.json \
            --sha "$EXPECTED_SOURCE_SHA" \
            --output release-evidence/certification-decision.json
      - name: Create reproducible release manifest
        shell: bash
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          RELEASE_STABILIZATION_SECONDS: ${{ inputs.stabilization_seconds || '60' }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const source_sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const ref = process.env.GITHUB_REF;
          const environment = process.env.RELEASE_ENVIRONMENT;
          const certification_run_id = process.env.GITHUB_RUN_ID;
          const stabilization_seconds = Number(process.env.RELEASE_STABILIZATION_SECONDS);
          if (!Number.isInteger(stabilization_seconds) || stabilization_seconds < 0) throw new Error('Invalid stabilization window');
          const migrations_fingerprint = execFileSync('bash', ['-lc', "find supabase/migrations -type f -name '*.sql' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1"], {encoding: 'utf8'}).trim();
          const dependency_lock_fingerprint = execFileSync('sha256sum', ['package-lock.json'], {encoding: 'utf8'}).trim().split(/\s+/)[0];
          const artifact_fingerprint = execFileSync('bash', ['-lc', "find dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1"], {encoding: 'utf8'}).trim();
          const decision = JSON.parse(fs.readFileSync('release-evidence/certification-decision.json', 'utf8'));
          if (decision.release !== 'approved') throw new Error(`RELEASE_BLOCKED:${JSON.stringify(decision.failures)}`);
          if (decision.source_sha !== source_sha) throw new Error(`DECISION_SOURCE_SHA_MISMATCH:${decision.source_sha}:${source_sha}`);
          const payload = {
            schema_version: 2,
            release_key: ref,
            source_sha,
            certification_run_id,
            migrations_fingerprint,
            dependency_lock_fingerprint,
            artifact_fingerprint,
            environment,
            stabilization_seconds,
            regression_results_path: decision.results_path,
            regression_scenario_count: decision.scenarioCount,
            regression_passed_scenario_count: decision.passedScenarioCount,
            evidence_contracts: {
              release_evidence: 'validated',
              production_certification: 'validated',
              production_regression: 'validated',
              production_release_blockers: 'validated',
              trust: 'validated',
              canary: 'validated',
              rollback: 'validated',
              fail_closed: 'validated'
            }
          };
          const manifest_id = crypto.createHash('sha256').update(JSON.stringify(payload)).digest('hex');
          const manifest = {...payload, manifest_id, generated_at: new Date().toISOString()};
          fs.writeFileSync('release-evidence/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          const enrichedDecision = {...decision, consumed_release_manifest_id: manifest_id, certification_run_id, environment, decided_at: decision.decided_at || new Date().toISOString()};
          fs.writeFileSync('release-evidence/certification-decision.json', JSON.stringify(enrichedDecision, null, 2) + '\n');
          fs.writeFileSync('release-evidence/manifest.env', [
            `manifest_id=${manifest_id}`,
            `source_sha=${source_sha}`,
            `certification_run_id=${certification_run_id}`,
            `ref=${ref}`,
            `environment=${environment}`,
            `migrations_fingerprint=${migrations_fingerprint}`,
            `dependency_lock_fingerprint=${dependency_lock_fingerprint}`,
            `artifact_fingerprint=${artifact_fingerprint}`,
            `generated_at=${manifest.generated_at}`
          ].join('\n') + '\n');
          NODE
          cat release-evidence/manifest.json
          cat release-evidence/certification-decision.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30
