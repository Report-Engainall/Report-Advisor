name: Product Build Gate

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: product-build-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate bounded stale-run cleanup
        run: node scripts/cancel-stale-pr-workflow-runs-contract.test.mjs
      - name: Cancel obsolete runs for this pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/cancel-stale-pr-workflow-runs.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Smart report surface contract
        run: node scripts/smart-report-complete-intelligence-surface.test.mjs
      - name: Smart report evidence boundary contract
        run: node --experimental-strip-types scripts/report-smart-evidence-boundary.test.ts
      - name: Customer-facing report surface contract
        run: node scripts/customer-facing-report-surface-contract.test.mjs
      - name: Source upload UI contract
        run: node scripts/source-upload-ui-contract.test.mjs
