name: authenticated-import-certification

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/remediation-electron44-electron

permissions:
  contents: read

concurrency:
  group: authenticated-import-certification
  cancel-in-progress: false

jobs:
  staging-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate certification environment before heavyweight setup
        env:
          E2E_BASE_URL: https://report-advisor-git-desktop-remediation-electron44-aaf686-injaz2.vercel.app
          E2E_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          E2E_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          E2E_EXPECTED_TENANT_ID: ${{ secrets.CERT_TENANT_A_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_EMAIL E2E_PASSWORD E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY E2E_EXPECTED_TENANT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required certification environment: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "AUTHENTICATED_CERTIFICATION_ENV_MISSING"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated canonical import
        env:
          E2E_BASE_URL: https://report-advisor-git-desktop-remediation-electron44-aaf686-injaz2.vercel.app
          E2E_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          E2E_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          E2E_IMPORT_PATH: /import
          E2E_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          E2E_EXPECTED_TENANT_ID: ${{ secrets.CERT_TENANT_A_ID }}
        run: npx playwright test tests/e2e/authenticated-import.spec.ts --reporter=line

      - name: Preserve Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-import-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
