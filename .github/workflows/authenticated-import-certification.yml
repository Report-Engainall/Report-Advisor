name: authenticated-import-certification

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/remediation-electron44-electron

permissions:
  contents: read

concurrency:
  group: authenticated-import-certification
  cancel-in-progress: false

jobs:
  staging-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated canonical import
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_IMPORT_PATH: /import
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_EXPECTED_TENANT_ID: ${{ secrets.E2E_EXPECTED_TENANT_ID }}
        run: npx playwright test tests/e2e/authenticated-import.spec.ts --reporter=line

      - name: Preserve Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-import-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
