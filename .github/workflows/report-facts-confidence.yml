name: Report Facts Confidence Boundary
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  confidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run report-fact boundary contract
        run: node scripts/check-report-facts-confidence.mjs
