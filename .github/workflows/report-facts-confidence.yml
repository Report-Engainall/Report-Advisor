name: Report Facts Confidence Boundary
on:
  pull_request:
  push:

jobs:
  confidence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run report-fact boundary contract
        run: node scripts/check-report-facts-confidence.mjs
