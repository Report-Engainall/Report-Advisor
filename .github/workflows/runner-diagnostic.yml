name: runner-diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runner-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Runner started
        run: |
          set -euxo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          node --version
          npm --version
      - name: Repository checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Repository probe
        run: |
          set -euxo pipefail
          test -f package.json
          test -f package-lock.json
          node -e "const p=require('./package.json'); console.log('package='+p.name); console.log('scripts='+Object.keys(p.scripts||{}).length)"
          echo "runner diagnostic: PASS"
