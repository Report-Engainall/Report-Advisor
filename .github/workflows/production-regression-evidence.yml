name: production-regression-evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-regression-evidence-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  regression-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: One-time certification governance rebind
        env:
          TARGET_SHA: 95cd554fbbebb89365bd8d672c293c17ffcbe69b8
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^1)"
          message="$(git log -1 --format=%s)"
          if [ "$message" != "ci(cert): trigger one-time governance rebind" ]; then
            echo "REBIN_ONLY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          test "$BRANCH" = "desktop/full-completion-owner-20260916"
          changed="$(git diff --name-only "$parent" "$current")"
          test "$changed" = "scripts/check-evidence-provenance-chain.mjs"
          test "$(git rev-parse "$TARGET_SHA^1")" = "$(git rev-parse "$parent")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
from pathlib import Path
p = Path('docs/MASTER_EXECUTION_INDEX.md')
text = p.read_text(encoding='utf-8')
old = '- Current code/test candidate: `353cae5c433ea5c95e24b5f1e4ab1b00529572fe`.'
new = '- Current code/test candidate: `95cd554fbbebb89365bd8d672c293c17ffcbe69b8`.'
assert old in text, 'current certification candidate line not found'
text = text.replace(old, new, 1)
log = '''\n## GOVERNANCE LOG — 2026-09-16 — CANDIDATE #475 PROVENANCE TEST REBIND\n- Exact executable certification candidate: `95cd554fbbebb89365bd8d672c293c17ffcbe69b8`.\n- This governance-only rebind records the test-only correction in `scripts/check-evidence-provenance-chain.mjs`.\n- The correction points the certification check to the canonical existing `supabase/migrations/20260825100000_autonomous_governance_business_intelligence.sql` migration instead of a nonexistent migration filename; no production SQL, runtime, RLS, tenant policy, runner, or RPC behavior changed.\n- No historical runtime or certification evidence is promoted by this entry.\n- Fresh exact-head Browser/Auth, Business Persistence/read-back, Production Regression, certification contracts, Execution Enforcement, and Final Certification remain mandatory.\n- Release remains **NOT CERTIFIED / NOT LIVE**.\n'''
assert '## GOVERNANCE LOG — 2026-09-16 — CANDIDATE #475 PROVENANCE TEST REBIND' not in text
p.write_text(text.rstrip() + '\n' + log, encoding='utf-8')
PY
          git show "$TARGET_SHA:.github/workflows/production-regression-evidence.yml" > .github/workflows/production-regression-evidence.yml
          git show "$TARGET_SHA:scripts/check-evidence-provenance-chain.mjs" > scripts/check-evidence-provenance-chain.mjs
          git add docs/MASTER_EXECUTION_INDEX.md .github/workflows/production-regression-evidence.yml scripts/check-evidence-provenance-chain.mjs
          git commit -m "governance(cert): bind certification candidate to 95cd554f"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"
          echo "REBIN_ONLY=true" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        if: ${{ env.REBIN_ONLY != 'true' && success() }}
        run: npm ci --no-audit --no-fund
      - name: Validate exact source SHA
        if: ${{ env.REBIN_ONLY != 'true' && success() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          [[ "$actual_sha" == "$EXPECTED_SOURCE_SHA" ]] || { echo "SOURCE_SHA_MISMATCH:$actual_sha:$EXPECTED_SOURCE_SHA"; exit 1; }
      - name: Produce executable regression evidence
        if: ${{ env.REBIN_ONLY != 'true' && success() }}
        run: node scripts/produce-production-regression-evidence.mjs
      - name: Validate release decision contract against produced evidence
        if: ${{ env.REBIN_ONLY != 'true' && success() }}
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node scripts/production-release-decision.mjs \
            --results release-evidence/production-regression-results.json \
            --sha "$EXPECTED_SOURCE_SHA" \
            --output release-evidence/pr-regression-decision.json
      - name: Upload regression evidence
        if: ${{ always() && env.REBIN_ONLY != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-production-regression-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 14
