name: financial-currency-contract

on:
  pull_request:

jobs:
  financial-currency-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/financial-currency-storage-contract.test.mjs