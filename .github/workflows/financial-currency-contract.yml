name: financial-currency-contract

on:
  pull_request:

jobs:
  financial-currency-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify exact PR head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          ACTUAL_HEAD="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test -n "$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
      - run: node scripts/financial-currency-storage-contract.test.mjs
      - run: node scripts/financial-currency-consumer-contract.test.mjs
