name: Device-Independent Browser E2E

on:
  push:
    branches:
      - 'ops/free-cloud-runtime-*'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/device-independent-smoke.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
  workflow_dispatch:


permissions:
  contents: read

concurrency:
  group: device-independent-smoke-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  browser-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact HEAD
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start exact-head preview
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/report-advisor-smoke.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/report-advisor-smoke.log
          exit 1
      - name: Browser smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          const errors = [];
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          page.on('pageerror', e => errors.push(e.message));
          await page.goto(process.env.E2E_BASE_URL, { waitUntil: 'networkidle', timeout: 30000 });
          const body = await page.locator('body').innerText();
          if (!body.trim()) throw new Error('Empty page body');
          if (errors.length) throw new Error(errors.join(' | '));
          console.log(JSON.stringify({ url: page.url(), title: await page.title(), bodyChars: body.length }));
          await browser.close();
          NODE

  authenticated-e2e:
    needs: browser-smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - name: Verify real E2E secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY USER_A_EMAIL USER_A_PASSWORD USER_B_EMAIL USER_B_PASSWORD; do
            if [ -n "${!name:-}" ]; then echo "$name=SET"; else echo "$name=MISSING"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'AUTHENTICATED_E2E_BLOCKED: provision the dedicated test-only Staging secrets; no device-local workaround is accepted.'
            exit 2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact HEAD for authenticated run
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start exact-head preview
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/report-advisor-auth-e2e.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/report-advisor-auth-e2e.log
          exit 1
      - name: Run authenticated Auth/Tenant/Product/Import browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
          E2E_REPORT_DIR: artifacts/device-independent-e2e
        run: node scripts/run-full-product-browser-e2e.mjs
      - name: Upload cloud E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-independent-e2e-${{ env.EXACT_HEAD }}
          path: artifacts/device-independent-e2e
          if-no-files-found: warn

