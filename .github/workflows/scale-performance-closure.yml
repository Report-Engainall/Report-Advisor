name: scale-performance-closure

on:
  workflow_dispatch:
  push:
    branches:
      - execution/owner-level-compatibility-hardening-main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  scale-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run deterministic scale/concurrency harness
        run: node --expose-gc scripts/p1-scale-performance-closure.mjs

      - name: Run existing production scale contract
        run: npm run test:production-scale

      - name: Run bounded concurrency contract
        run: npm run test:bounded-concurrency

      - name: Run concurrent analysis contract
        run: npm run test:concurrent-analysis
