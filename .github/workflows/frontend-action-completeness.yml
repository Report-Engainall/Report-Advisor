name: frontend-action-completeness

on:
  pull_request:

jobs:
  action-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/frontend-action-completeness-scan.mjs