name: wave09-cross-surface-closure

on:
  push:
    branches: ["**"]
    paths:
      - "src/pages/DashboardPage.tsx"
      - "src/pages/ReportsPage.tsx"
      - "src/lib/canonical-analytics.ts"
      - "src/lib/canonical-secondary-data-truth.ts"
      - "src/lib/report-export-data.ts"
      - "src/lib/intelligence/decisionScore.ts"
      - "src/lib/intelligence/decisionChain.ts"
      - "src/lib/intelligence/decisionExplainability.ts"
      - "src/lib/analytics/intelligence-gate.ts"
      - "supabase/migrations/20260826130000_cross_surface_truth_closure.sql"
      - "supabase/migrations/20260826131000_analytics_domain_truth.sql"
      - "scripts/execution-wave-09-cross-surface-closure.mjs"
      - "docs/MASTER_EXECUTION_INDEX.md"
      - ".github/workflows/wave09-cross-surface-closure.yml"
  pull_request:
    paths:
      - "src/pages/DashboardPage.tsx"
      - "src/pages/ReportsPage.tsx"
      - "src/lib/canonical-analytics.ts"
      - "src/lib/canonical-secondary-data-truth.ts"
      - "src/lib/report-export-data.ts"
      - "src/lib/intelligence/decisionScore.ts"
      - "src/lib/intelligence/decisionChain.ts"
      - "src/lib/intelligence/decisionExplainability.ts"
      - "src/lib/analytics/intelligence-gate.ts"
      - "supabase/migrations/20260826130000_cross_surface_truth_closure.sql"
      - "supabase/migrations/20260826131000_analytics_domain_truth.sql"
      - "scripts/execution-wave-09-cross-surface-closure.mjs"
      - "docs/MASTER_EXECUTION_INDEX.md"
      - ".github/workflows/wave09-cross-surface-closure.yml"

permissions:
  contents: read

auto_cancel: false

jobs:
  cross-surface-truth:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cross-surface behavioral truth regression
        run: node scripts/execution-wave-09-cross-surface-closure.mjs
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm ci --no-audit --no-fund >/tmp/typecheck-install.log 2>&1
          install_status=$?
          if [ "$install_status" -ne 0 ]; then
            cat /tmp/typecheck-install.log
            exit "$install_status"
          fi
          npm run typecheck >/tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          exit "$status"
      - name: Upload typecheck diagnostics on failure
        if: ${{ failure() && steps.typecheck.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: wave09-typecheck-diagnostics
          path: |
            /tmp/typecheck.log
            /tmp/typecheck-install.log
          if-no-files-found: warn
