name: canonical-truth-boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  canonical-truth-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/canonical-truth-boundary.test.ts
