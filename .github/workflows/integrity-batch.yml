name: integrity-batch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-batch-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  command-integrity:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Workflow command integrity
        run: node scripts/check-workflow-command-integrity.mjs
      - name: Extended workflow command integrity
        run: node scripts/check-workflow-command-integrity-extended.mjs
      - name: Import state contract
        run: node scripts/check-import-state-contract.mjs
