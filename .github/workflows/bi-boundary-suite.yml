name: BI Boundary Suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bi-boundary-suite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bi-boundary-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run consolidated BI boundary suite
        run: npm run test:bi-boundary-suite
