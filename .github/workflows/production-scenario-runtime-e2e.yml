name: Production Scenario Runtime E2E

on:
  push:
    paths:
      - 'scripts/production-scenario-runtime-e2e.mjs'
      - 'scripts/production-scenario-matrix.mjs'
      - 'scripts/production-scenario-execution-contract.mjs'
      - 'src/pages/CanonicalImportPage.tsx'
      - 'src/lib/import/**'
      - 'src/lib/report-execution/**'
      - '.github/workflows/production-scenario-runtime-e2e.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/production-scenario-runtime-e2e.mjs'
      - 'scripts/production-scenario-matrix.mjs'
      - 'scripts/production-scenario-execution-contract.mjs'
      - 'src/pages/CanonicalImportPage.tsx'
      - 'src/lib/import/**'
      - 'src/lib/report-execution/**'
      - '.github/workflows/production-scenario-runtime-e2e.yml'

permissions:
  contents: read

jobs:
  runtime-scenarios:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install browser E2E runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact HEAD
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start exact-head application
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/report-advisor-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/report-advisor-preview.log
          exit 1
      - name: Verify authenticated scenario secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SUPABASE_URL SUPABASE_ANON_KEY USER_A_EMAIL USER_A_PASSWORD; do
            test -n "${!name:-}" || { echo "$name=MISSING"; exit 2; }
          done
      - name: Execute 12 real staging scenarios
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          E2E_BASE_URL: http://127.0.0.1:4173
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
        run: node scripts/production-scenario-runtime-e2e.mjs
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-scenario-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-evidence/production-regression-results.json
          if-no-files-found: error
          retention-days: 1
