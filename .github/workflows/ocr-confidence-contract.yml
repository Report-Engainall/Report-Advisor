name: OCR Confidence Contract
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check 'fastapi>=0.115,<1' 'Pillow>=11,<13' 'python-multipart>=0.0.20,<1'
      - run: node scripts/check-ocr-confidence-contract.mjs
      - run: python services/document-intelligence/tests/test_ocr_runtime.py
