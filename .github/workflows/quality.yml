name: quality
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name}}-${{ github.run_id}}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          test -f package-lock.json
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            expected_head="$(node -e "const fs=require('fs'); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')); process.stdout.write(e.pull_request.head.sha)")"
            actual_head="$(git ls-remote origin "refs/heads/${GITHUB_HEAD_REF}" | awk '{print $1}')"
            test -n "$actual_head"
            test "$actual_head" = "$expected_head"
            echo "PR_HEAD_SHA=$actual_head"
            echo "MERGE_REF_SHA=$GITHUB_SHA"
          else
            echo "CODE_HEAD_SHA=$(git rev-parse HEAD)"
          fi
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Phase 1 foundation closure
        run: node scripts/check-phase1-foundation-closure.mjs
      - name: Architecture contract
        run: npm run test:contracts
      - name: Concurrent analysis contract
        run: npm run test:concurrent-analysis
      - name: Document resilience contract
        run: npm run test:document-resilience && node --experimental-strip-types scripts/check-document-extraction-behavior.ts
      - name: 20-stage parallel release readiness
        run: npm run test:20-stage-readiness
      - name: Workflow command integrity
        run: npm run test:workflow-command-integrity
      - name: CI topology and canonical release wiring
        run: node scripts/check-ci-execution-topology.mjs && node scripts/check-production-recovery-gate.mjs
      - name: Cross-surface capability traceability
        run: node scripts/check-cross-surface-traceability.mjs
      - name: Public RPC advisor hardening
        run: node scripts/check-public-rpc-advisor-hardening.mjs && node scripts/check-unused-recommendation-status-rpc.mjs
      - name: Authentication and tenant convergence
        run: npm run test:auth-tenant-convergence
      - name: Tenant legacy consumer boundary
        run: node scripts/check-tenant-legacy-consumers.mjs
      - name: Tenant legacy consumer regression
        run: node scripts/check-tenant-legacy-consumers-regression.mjs
      - name: Adversarial tenant source boundary
        run: node scripts/check-tenant-adversarial-contract.mjs
      - name: Data Quality projection contract
        run: npm run test:data-quality-projections
      - name: Company configuration truth
        run: node scripts/check-company-config-truth.mjs
      - name: Database migration schema audit
        run: npm run test:migration-schema-audit
      - name: Database migration dependency analysis
        run: npm run test:migration-dependencies
      - name: Master requirements lock
        run: npm run test:master-requirements
      - name: Quality workflow contract
        run: npm run test:quality-workflow-contract
      - name: Core contracts
        run: npm run test:file-engine-contract && npm run test:file-engine-capability-contract && npm run test:schema-intelligence && npm run test:schema-entity-reconciliation && npm run test:a0-hardening-contract && npm run test:golden-dataset-contract && npm run test:canonical-import-mapping && npm run test:onyx-adapter-contract && npm run test:report-execution-foundation && npm run test:report-execution-e2e-contract && npm run test:report-execution-coordinator-contract && npm run test:automation-executor-contract && npm run test:forecast-calibration-contract && npm run test:entitlements-billing-contract && npm run test:decision-intelligence-closure && npm run test:production-saas-certification
      - name: Golden E2E corpus
        run: npm run test:golden-e2e-corpus
      - name: Report execution failure state machine
        run: node scripts/check-report-execution-failure-state-machine.mjs && node --experimental-strip-types scripts/report-execution-runtime.test.ts
      - name: Production certification evidence integrity
        run: npm run test:production-certification-evidence-integrity
      - name: Production certification
        run: npm run test:production-certification-contract
      - name: Release evidence consumption workflow
        run: npm run test:release-evidence-consumption-workflow
      - name: Operational resilience certification
        run: npm run test:operational-resilience && npm run test:release-resilience-manifest && node scripts/check-release-evidence-contract.mjs && node scripts/check-release-workflow-contract.mjs
      - name: Continuous trust certification
        run: npm run test:continuous-trust
      - name: Autonomous governance certification
        run: node scripts/check-autonomous-governance-contract.mjs && node scripts/check-governance-intelligence-hardening.mjs
      - name: Watched reports and text-first pipeline
        run: node scripts/check-import-folder-foundation.mjs && node scripts/check-folder-watch-platform-contract.mjs && node scripts/check-watched-report-relative-path-contract.mjs && npm run test:watched-report-pipeline && npm run test:incremental-import-ledger
      - name: Autonomous business control plane
        run: npm run test:business-control-plane && npm run test:phase-k-production-intelligence && npm run test:phase-k-runtime && npm run test:phase-l-runtime && npm run test:phase-l-resumable-execution && npm run test:phase-m-certification && npm run test:k-to-s-closure && npm run test:k-to-s-deep-closure
      - name: KPI presentation truth
        run: node scripts/check-kpi-presentation-truth.mjs
      - name: Secondary consumer canonical data truth
        run: node scripts/check-secondary-consumer-canonical.mjs && node scripts/check-report-data-truth-closure.mjs
      - name: Production release blockers
        run: npm run test:production-release-blockers
      - name: Phase 10 backup/restore contract
        run: node scripts/check-phase10-backup-restore-contract.mjs
      - name: Phase 11 E2E and performance closure
        run: npm run test:phase11-e2e-performance-closure
      - name: Phase 12 release certification gate
        run: node scripts/check-phase12-release-certification-gate.mjs
      - name: Work-item outcome provenance boundary
        run: node scripts/check-work-item-outcome-provenance-boundary.mjs
      - name: Outcome evidence snapshot identity
        run: node scripts/check-outcome-provenance-identity.mjs
      - name: Work-item assignment integrity
        run: node scripts/check-work-item-assignment-integrity.mjs && node scripts/check-work-item-assignment-integrity-regression.mjs
      - name: A0 intelligence hardening
        run: npm run test:a0-hardening-contract
