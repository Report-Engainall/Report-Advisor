name: quality
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          test -f package-lock.json
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Inventory intelligence truth regression
        run: node scripts/check-inventory-intelligence-truth.mjs
      - name: Decision priority truth regression
        run: node scripts/check-decision-priority-truth.mjs
      - name: Workflow command integrity
        run: npm run test:workflow-command-integrity
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
