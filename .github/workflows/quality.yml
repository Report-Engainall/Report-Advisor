name: quality
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  # One authoritative quality run per PR/ref. A run_id in the group prevents
  # cancellation, which lets stale merge-ref diagnostics race the current HEAD.
  group: quality-${{ github.event.pull_request.number || github.ref_name }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - name: Diagnostics
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          python3 --version
          test -f package-lock.json
          checkout_sha="$(git rev-parse HEAD)"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            expected_head="$(node -e "const fs=require('fs'); const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8')); process.stdout.write(e.pull_request.head.sha)")"
            actual_head="$(git ls-remote origin "refs/heads/${GITHUB_HEAD_REF}" | awk '{print $1}')"
            test -n "$actual_head"
            test "$actual_head" = "$expected_head"
            # GitHub may expose GITHUB_SHA as the PR head while checkout is the
            # synthetic merge ref, or vice versa. Prove the checked-out tree
            # contains the exact PR head instead of assuming one SHA convention.
            if [ "$checkout_sha" != "$GITHUB_SHA" ]; then
              git merge-base --is-ancestor "$expected_head" "$checkout_sha"
            fi
            echo "PR_HEAD_SHA=$actual_head"
            echo "CHECKOUT_SHA=$checkout_sha"
            echo "GITHUB_SHA=$GITHUB_SHA"
          else
            test "$checkout_sha" = "$GITHUB_SHA"
            echo "CODE_HEAD_SHA=$checkout_sha"
          fi
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Phase 1 foundation closure
        run: node scripts/check-phase1-foundation-closure.mjs
      - name: Core build and static quality
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run perf:budget
          npm run test:production-scale
      - name: Master and production certification contracts
        run: |
          npm run test:master-requirements
          npm run test:production-certification-contract
          npm run test:continuous-trust
          npm run test:phase-k-runtime
          npm run test:phase-l-runtime
          npm run test:phase-m-certification
          npm run test:production-release-blockers
      - name: Architecture contract
        run: npm run test:contracts
      - name: Phase 3 import truth
        run: |
          node scripts/check-import-direct-write-guard.mjs
          npm run test:import-transaction-contract
          npm run test:import-runtime-governance
          npm run test:import-business-key
          npm run test:canonical-import-mapping
      - name: Operational resilience
        run: |
          npm run test:operational-resilience
          npm run test:release-resilience-manifest
      - name: Concurrent analysis contract
        run: npm run test:concurrent-analysis
      - name: Document resilience contract
        run: npm run test:document-resilience && node --experimental-strip-types scripts/check-document-extraction-behavior.ts
      - name: 20-stage parallel release readiness
        run: npm run test:20-stage-readiness
      - name: Workflow command integrity
        run: npm run test:workflow-command-integrity