name: quality
# Authoritative CI gate: install -> typecheck -> lint -> build -> performance -> architecture -> intelligence -> security/import/tenant/report-truth governance.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Environment diagnostics
        run: |
          set -euo pipefail
          node --version
          npm --version
          test -f package-lock.json
          test -f tsconfig.app.json
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Quality workflow contract
        run: npm run test:quality-workflow-contract
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Performance budget
        run: npm run perf:budget
      - name: PostCSS toolchain contract
        run: npm run test:postcss-toolchain
      - name: Architecture contracts
        run: npm run test:contracts
      - name: Selective foundation
        run: npm run test:selective-foundation
      - name: Consolidated intelligence
        run: npm run test:consolidated-intelligence
      - name: Inventory intelligence
        run: npm run test:inventory-intelligence
      - name: Alternative security
        run: npm run test:alternative-security
      - name: Alternative schema
        run: npm run test:alternative-schema
      - name: Decision dashboard
        run: npm run test:decision-dashboard
      - name: Inventory intelligence UI
        run: npm run test:inventory-intelligence-ui
      - name: Demand velocity
        run: npm run test:demand-velocity
      - name: Batch decision
        run: npm run test:batch-decision
      - name: Safe metrics
        run: npm run test:safe-metrics
      - name: Production scale
        run: npm run test:production-scale
      - name: Analysis cache policy
        run: npm run test:analysis-cache-policy
      - name: Analysis cache coordinator
        run: npm run test:analysis-cache-coordinator
      - name: Analysis invalidation
        run: npm run test:analysis-invalidation
      - name: Concurrent analysis
        run: npm run test:concurrent-analysis
      - name: Bounded concurrency
        run: npm run test:bounded-concurrency
      - name: Analysis batch runner
        run: npm run test:analysis-batch-runner
      - name: Document intelligence contract
        run: npm run test:document-intelligence-contract
      - name: Document intelligence semantic foundation
        run: npm run test:document-intelligence-semantic-foundation
      - name: Document intelligence hardening
        run: npm run test:document-intelligence-hardening
      - name: Document intelligence decision gate
        run: npm run test:document-intelligence-decision-gate
      - name: File intelligence security
        run: npm run test:file-intelligence-security
      - name: Import transaction contract
        run: npm run test:import-transaction-contract
      - name: Import runtime governance
        run: npm run test:import-runtime-governance
      - name: Tenant security contract
        run: npm run test:tenant-security-contract
      - name: Global tenant RLS
        run: npm run test:global-tenant-rls
      - name: Import RPC tenant context
        run: npm run test:import-rpc-tenant-context
      - name: Import business key
        run: npm run test:import-business-key
      - name: Report truth contract
        run: npm run test:report-truth
