name: Full Product Browser E2E

# Exact-head browser discovery gate. Push and PR triggers remain narrowly scoped to E2E/runtime surfaces.
on:
  push:
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/pages/**'
      - 'src/pages/**'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'src/components/ui/DataTable.tsx'
      - 'docs/MASTER_EXECUTION_INDEX.md'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'netlify/functions/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'src/components/ui/DataTable.tsx'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'netlify/functions/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  browser-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${EXACT_HEAD}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
      - name: Verify real corpus E2E secrets
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY USER_A_EMAIL USER_A_PASSWORD USER_B_EMAIL USER_B_PASSWORD; do
            if [ -n "${!name:-}" ]; then echo "$name=SET"; else echo "$name=MISSING"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'REAL_REPORT_E2E_BLOCKED: required dedicated staging E2E secrets are missing.'
            exit 2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install Chromium runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact HEAD
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          VITE_CANONICAL_IMPORT_EXECUTE_URL: https://deploy-preview-676--aghbari-report-advisor.netlify.app/api/canonical-import-execute
        run: npm run build
      - name: Start exact-head preview
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          VITE_CANONICAL_IMPORT_EXECUTE_URL: https://deploy-preview-676--aghbari-report-advisor.netlify.app/api/canonical-import-execute
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/report-advisor-full-browser.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/report-advisor-full-browser.log
          exit 1
      - name: Verify canonical import function
        shell: bash
        run: |
          set -euo pipefail
          url="https://deploy-preview-676--aghbari-report-advisor.netlify.app/api/canonical-import-execute"
          for i in {1..90}; do
            status="$(curl -sS -o /tmp/canonical-import-options.out -w '%{http_code}' -X OPTIONS "$url" || true)"
            if [ "$status" = "204" ]; then exit 0; fi
            sleep 2
          done
          cat /tmp/canonical-import-options.out || true
          echo "CANONICAL_IMPORT_FUNCTION_NOT_READY status=$status"
          exit 1
      - name: Run real report corpus serial E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          CANONICAL_IMPORT_EXECUTE_URL: https://deploy-preview-676--aghbari-report-advisor.netlify.app/api/canonical-import-execute
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
          REPORT_CORPUS_ROOT: tests/fixtures/realistic-reports
          REPORT_CORPUS_MAX: 48
          REPORT_CORPUS_COMPLETE: true
          E2E_REPORT_DIR: artifacts/real-report-e2e
        run: node scripts/real-business-e2e.mjs
      - name: Upload real report E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-report-e2e-${{ env.EXACT_HEAD }}
          path: artifacts/real-report-e2e
          if-no-files-found: warn
