name: Full Product Browser E2E

# Exact-head browser discovery gate. Push and PR triggers remain narrowly scoped to E2E/runtime surfaces.
on:
  push:
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/pages/**'
      - 'src/pages/**'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'src/components/ui/DataTable.tsx'
      - 'docs/MASTER_EXECUTION_INDEX.md'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'src/components/ui/DataTable.tsx'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  browser-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${EXACT_HEAD}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"