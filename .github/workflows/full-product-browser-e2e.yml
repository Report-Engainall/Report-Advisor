name: Full Product Browser E2E

# Exact-head browser discovery gate. Push and PR triggers remain narrowly scoped to E2E/runtime surfaces.
on:
  push:
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'docs/MASTER_EXECUTION_INDEX.md'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  browser-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${EXACT_HEAD}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$actual"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "WORKTREE=CLEAN"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install browser E2E runner
        run: npm install --no-save --ignore-scripts playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact HEAD
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Start exact-head application
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/report-advisor-preview.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/report-advisor-preview.log
          exit 1
      - name: Start exact-head canonical API server
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "AUTHENTICATED_E2E_SERVER_BOUNDARY_BLOCKED: service-role key secret is not provisioned."
            echo "The real business E2E cannot exercise the existing server worker boundary without the existing service-role runtime credential."
            exit 2
          fi
          nohup node --experimental-strip-types --experimental-loader ./scripts/node-ts-extension-loader.mjs scripts/local-api-test-server.mjs > /tmp/report-advisor-api.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4174/__health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/report-advisor-api.log
          exit 1
      - name: Verify authenticated E2E secret contract
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY USER_A_EMAIL USER_A_PASSWORD USER_B_EMAIL USER_B_PASSWORD; do
            if [ -n "${!name:-}" ]; then
              echo "$name=SET"
            else
              echo "$name=MISSING"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "AUTHENTICATED_E2E_BLOCKED: required test-only runtime secrets are not provisioned."
            echo "No browser PASS may be claimed until this contract is satisfied."
            exit 2
          fi
      - name: Run full product browser E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
        run: node scripts/run-full-product-browser-e2e.mjs
      - name: Verify KPI evidence capture persistence
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';
          const base = process.env.E2E_BASE_URL;
          const supabase = process.env.REPORT_ADVISOR_SUPABASE_URL.replace(/\/$/, '');
          const anon = process.env.REPORT_ADVISOR_SUPABASE_ANON_KEY;
          const email = process.env.TEST_USER_A_EMAIL;
          const password = process.env.TEST_USER_A_PASSWORD;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, locale: 'ar-SA' });
          const page = await context.newPage();
          const errors = [];
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          page.on('pageerror', error => errors.push(error.message));
          await page.goto(base, { waitUntil: 'networkidle', timeout: 30000 });
          await page.locator('#login-email').fill(email);
          await page.locator('#login-password').fill(password);
          await page.getByRole('button', { name: 'تسجيل الدخول' }).click();
          await page.waitForLoadState('networkidle', { timeout: 30000 }).catch(() => {});
          await page.waitForTimeout(1500);

          async function authenticatedSession(targetPage) {
            let lastError = null;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                return await targetPage.evaluate(() => {
                  const raw = Object.entries(localStorage).find(([key]) => key.endsWith('-auth-token'))?.[1];
                  if (!raw) throw new Error('BROWSER_SESSION_NOT_FOUND');
                  const parsed = JSON.parse(raw);
                  if (!parsed?.access_token || !parsed?.user?.id) throw new Error('BROWSER_SESSION_INVALID');
                  return { accessToken: parsed.access_token, userId: parsed.user.id };
                });
              } catch (error) {
                lastError = error;
                if (attempt < 10) await new Promise(resolve => setTimeout(resolve, 400));
              }
            }
            throw lastError || new Error('BROWSER_SESSION_CONVERGENCE_FAILED');
          }

          const session = await authenticatedSession(page);
          async function rest(path, options = {}) {
            return page.evaluate(async ({ url, key, token, path, method, body }) => {
              const headers = { apikey: key, Authorization: `Bearer ${token}`, ...(body ? { 'Content-Type': 'application/json' } : {}) };
              const r = await fetch(`${url}${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
              const text = await r.text();
              return { ok: r.ok, status: r.status, text };
            }, { url: supabase, key: anon, token: session.accessToken, path, method: options.method || 'GET', body: options.body || null });
          }
          const companyRpc = await page.evaluate(async ({ url, key, token }) => {
            const r = await fetch(`${url}/rest/v1/rpc/current_company_id`, { method: 'POST', headers: { apikey: key, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: '{}' });
            return { ok: r.ok, status: r.status, text: await r.text() };
          }, { url: supabase, key: anon, token: session.accessToken });
          if (!companyRpc.ok) throw new Error(`CURRENT_COMPANY_ID_HTTP_${companyRpc.status}:${companyRpc.text}`);
          const companyId = companyRpc.text.replaceAll('"', '');
          if (!companyId) throw new Error('TENANT_REQUIRED');
          const before = await rest(`/rest/v1/kpi_evidence_snapshots?select=id&company_id=eq.${encodeURIComponent(companyId)}`);
          if (!before.ok) throw new Error(`KPI_TABLE_READ_HTTP_${before.status}:${before.text}`);
          const beforeRows = JSON.parse(before.text);
          await page.goto(`${base}/metrics`, { waitUntil: 'networkidle', timeout: 30000 });
          const metricButton = page.locator('button').filter({ hasText: 'metric.net_sales' }).first();
          await metricButton.waitFor({ state: 'visible', timeout: 15000 });
          await metricButton.click();
          const captureButton = page.getByRole('button', { name: 'التقاط دليل فعلي' });
          await captureButton.waitFor({ state: 'visible', timeout: 15000 });
          await captureButton.click();
          await page.getByText('تم حفظ دليل المؤشر فعليًا').waitFor({ state: 'visible', timeout: 30000 });
          const snapshotText = await page.locator('body').innerText();
          if (!snapshotText.includes('dashboard.total_sales')) throw new Error('KPI_EVIDENCE_KEY_NOT_RENDERED');
          if (!snapshotText.includes('metric.net_sales')) throw new Error('CANONICAL_METRIC_ID_NOT_RENDERED');
          if (errors.length) throw new Error(`BROWSER_ERRORS:${errors.join(' | ')}`);
          const match = snapshotText.match(/Snapshot:\s*([0-9a-f-]{36})/i);
          if (!match) throw new Error('SNAPSHOT_ID_NOT_RENDERED');
          const snapshotId = match[1];
          const after = await rest(`/rest/v1/kpi_evidence_snapshots?select=id,company_id,kpi_key,value,observed_at,quality,source_evidence&id=eq.${snapshotId}&company_id=eq.${encodeURIComponent(companyId)}&limit=1`);
          if (!after.ok) throw new Error(`KPI_READBACK_HTTP_${after.status}:${after.text}`);
          const rows = JSON.parse(after.text);
          if (rows.length !== 1) throw new Error('KPI_SNAPSHOT_NOT_PERSISTED');
          const row = rows[0];
          if (row.company_id !== companyId) throw new Error('KPI_READBACK_TENANT_MISMATCH');
          if (row.kpi_key !== 'dashboard.total_sales') throw new Error(`KPI_READBACK_KEY_MISMATCH:${row.kpi_key}`);
          if (row.value == null || row.observed_at == null || row.quality == null || !row.source_evidence) throw new Error('KPI_READBACK_PROVENANCE_INCOMPLETE');
          const afterCount = beforeRows.length + 1;
          const recount = await rest(`/rest/v1/kpi_evidence_snapshots?select=id&company_id=eq.${encodeURIComponent(companyId)}&kpi_key=eq.dashboard.total_sales`);
          if (!recount.ok) throw new Error(`KPI_RECOUNT_HTTP_${recount.status}:${recount.text}`);
          if (JSON.parse(recount.text).length < afterCount) throw new Error('KPI_EXPECTED_PERSISTENCE_COUNT_NOT_REACHED');
          await fs.mkdir('artifacts/e2e-kpi', { recursive: true });
          await page.screenshot({ path: 'artifacts/e2e-kpi/kpi-evidence-capture.png', fullPage: true });
          await fs.writeFile('artifacts/e2e-kpi/kpi-evidence-capture.json', JSON.stringify({ exactHead: process.env.EXACT_HEAD, companyId, snapshotId, metricId: 'metric.net_sales', kpiKey: row.kpi_key, value: row.value, observedAt: row.observed_at, quality: row.quality, sourceEvidence: row.source_evidence, beforeCount: beforeRows.length }, null, 2));
          console.log(JSON.stringify({ exactHead: process.env.EXACT_HEAD, companyId, snapshotId, metricId: 'metric.net_sales', kpiKey: row.kpi_key, value: row.value, observedAt: row.observed_at, quality: row.quality, beforeCount: beforeRows.length, status: 'PASS' }, null, 2));
          await browser.close();
          NODE
      - name: Run real business persistence E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
          CANONICAL_API_BASE_URL: http://127.0.0.1:4174
        run: node scripts/real-business-e2e.mjs
      - name: Verify live business evidence boundary
        env:
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          TEST_USER_A_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
        run: node scripts/verify-live-business-evidence.mjs
      - name: Upload browser E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-product-browser-e2e-${{ env.EXACT_HEAD }}
          path: artifacts/e2e
          if-no-files-found: warn
      - name: Upload KPI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-evidence-${{ env.EXACT_HEAD }}
          path: artifacts/e2e-kpi
          if-no-files-found: warn
      - name: Upload real business E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-business-e2e-${{ env.EXACT_HEAD }}
          path: artifacts/e2e-business
          if-no-files-found: warn
      - name: Upload live business evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-business-evidence-${{ env.EXACT_HEAD }}
          path: artifacts/live-production-evidence
          if-no-files-found: warn
