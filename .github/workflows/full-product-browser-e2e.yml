name: Full Product Browser E2E

# Exact-head browser discovery and proof gate.
# Uses the repository's existing Playwright runner; no duplicate browser framework is introduced.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/pages/**'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'src/components/ui/DataTable.tsx'
      - 'docs/MASTER_EXECUTION_INDEX.md'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'src/pages/**'
      - 'src/lib/dashboard-canonical.ts'
      - 'src/lib/kpi-evidence.ts'
      - 'src/lib/semantic-metric-service.ts'
      - 'src/lib/semantic-metric-registry.ts'
      - 'src/lib/semanticMetrics.ts'
      - 'src/pages/MetricInspectorPage.tsx'
      - 'src/lib/queries.ts'
      - 'src/components/ui/DataTable.tsx'
      - 'E2E_FAILURE_LEDGER.md'
      - 'E2E_PRODUCT_GAP_LEDGER.md'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  browser-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${EXACT_HEAD}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$actual"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Playwright runner
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Build web application
        run: npm run build

      - name: Start Vite preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/report-advisor-vite.log 2>&1 &
          echo $! > /tmp/report-advisor-vite.pid

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              echo "Vite preview is ready on 127.0.0.1:4173"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/report-advisor-vite.log
          exit 1

      - name: Run repository Playwright browser proof
        id: browser-proof
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
          E2E_REPORT_DIR: artifacts/e2e
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          EXACT_HEAD: ${{ env.EXACT_HEAD }}
        run: |
          set +e
          mkdir -p artifacts/e2e
          node scripts/run-full-product-browser-e2e.mjs
          status=$?
          echo "PLAYWRIGHT_EXIT_CODE=$status" | tee artifacts/e2e/exit-code.txt

          case "$status" in
            0)
              echo "Playwright browser proof completed with PASS."
              exit 0
              ;;
            2)
              echo "Playwright browser proof reached the runner but authenticated evidence is BLOCKED by missing runtime access/secrets."
              exit 0
              ;;
            *)
              echo "Playwright browser proof found a reproducible test/harness failure."
              exit "$status"
              ;;
          esac

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-advisor-browser-evidence-${{ github.run_id }}
          path: |
            artifacts/e2e
            /tmp/report-advisor-vite.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Vite preview
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/report-advisor-vite.pid ]; then
            kill "$(cat /tmp/report-advisor-vite.pid)" 2>/dev/null || true
          fi
