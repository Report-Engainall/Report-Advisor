name: Full Product Browser E2E

# This workflow is an executable browser proof, not an exact-checkout-only gate.
# It builds the exact SHA, starts that build locally, runs the real Playwright harness,
# and keeps authentication/tenant proof fail-closed when credentials are unavailable.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/run-full-product-browser-e2e.mjs'
      - 'scripts/real-business-e2e.mjs'
      - 'scripts/verify-live-business-evidence.mjs'
      - '.github/workflows/full-product-browser-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  E2E_BASE_URL: http://127.0.0.1:4173
  E2E_REPORT_DIR: artifacts/e2e

jobs:
  browser-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
      TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
      TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
      TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
      REPORT_ADVISOR_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
      REPORT_ADVISOR_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${EXACT_HEAD}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$actual"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Playwright runtime
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Build exact current SHA
        run: npm run build

      - name: Start exact current SHA preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/report-advisor-preview.log 2>&1 &
          echo $! > /tmp/report-advisor-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$E2E_BASE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/report-advisor-preview.log
          exit 1

      - name: Require authenticated browser proof inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_USER_A_EMAIL"
          test -n "$TEST_USER_A_PASSWORD"
          test -n "$REPORT_ADVISOR_SUPABASE_URL"
          test -n "$REPORT_ADVISOR_SUPABASE_ANON_KEY"
          test -n "$TEST_USER_B_EMAIL"
          test -n "$TEST_USER_B_PASSWORD"

      - name: Execute authenticated browser proof
        run: node scripts/run-full-product-browser-e2e.mjs

      - name: Upload browser proof artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-product-browser-e2e-${{ github.sha }}
          path: artifacts/e2e/
          if-no-files-found: warn

      - name: Show preview logs on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          test ! -f /tmp/report-advisor-preview.log || cat /tmp/report-advisor-preview.log
