name: phase-f-live-resilience
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-f-live-resilience-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOVERNANCE_HEAD: ${{ github.sha }}
      EXACT_HEAD: ''
      RESILIENCE_BACKUP_MODE: ${{ secrets.RESILIENCE_BACKUP_MODE || vars.RESILIENCE_BACKUP_MODE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve certification code candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ github.event.pull_request.head.sha }}" ]]; then
            candidate="${{ github.event.pull_request.head.sha }}"
          else
            candidate="${{ github.sha }}"
          fi
          test "$candidate" = "$(git rev-parse "$candidate^{commit}")"
          if [[ -z "${{ github.event.pull_request.head.sha }}" ]]; then
            git merge-base --is-ancestor "$candidate" "${{ github.sha }}"
          else
            test "$candidate" = "${{ github.event.pull_request.head.sha }}"
          fi
          git checkout --detach "$candidate"
          test -z "$(git status --porcelain)"
          printf 'EXACT_HEAD=%s\n' "$candidate" >> "$GITHUB_ENV"
          printf 'GOVERNANCE_HEAD=%s\n' "${{ github.sha }}" >> "$GITHUB_ENV"
          echo "EXACT_HEAD=$candidate"
          echo "GOVERNANCE_HEAD=${{ github.sha }}"
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${EXACT_HEAD:?EXACT_HEAD_NOT_RESOLVED}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$actual"
          echo "GOVERNANCE_HEAD=${GOVERNANCE_HEAD:?GOVERNANCE_HEAD_NOT_RESOLVED}"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Logical restore certification intentionally replays the repository migrations, including the current carts/cart_items parity wave.
      - name: Install Supabase CLI for logical backup mode
        if: ${{ (env.RESILIENCE_BACKUP_MODE || 'logical') == 'logical' }}
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Local operational runtime tests
        run: node scripts/resilience-runtime.test.mjs
      - name: Static resilience contracts
        run: npm run test:operational-resilience && npm run test:release-resilience-manifest && npm run test:continuous-trust
      - name: Resolve fresh authenticated canary session
        env:
          SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTH_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          AUTH_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          token="$(node --input-type=module <<'NODE'
          const { createClient } = await import('@supabase/supabase-js');

          const url = process.env.SUPABASE_URL?.trim();
          const anonKey = process.env.SUPABASE_ANON_KEY?.trim();
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim();
          const email = process.env.AUTH_EMAIL?.trim();
          if (!url || !anonKey || !serviceRoleKey || !email) {
            throw new Error('PHASE_F_CANARY_AUTH_ENV_MISSING');
          }

          const retryableStatuses = new Set([408, 425, 429, 500, 502, 503, 504]);
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const admin = createClient(url, serviceRoleKey, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const client = createClient(url, anonKey, {
            auth: { autoRefreshToken: false, persistSession: false },
          });

          let lastError = null;

          for (let attempt = 1; attempt <= 4; attempt += 1) {
            try {
              const generated = await admin.auth.admin.generateLink({
                type: 'magiclink',
                email,
              });

              if (generated.error) {
                const status = Number(generated.error.status ?? 0);
                lastError = new Error('PHASE_F_CANARY_GENERATE_LINK_FAILED:' + status + ':' + (generated.error.message || 'unknown'));
                if (!retryableStatuses.has(status) || attempt === 4) throw lastError;
              } else {
                const tokenHash = generated.data?.properties?.hashed_token;
                if (!tokenHash) throw new Error('PHASE_F_CANARY_TOKEN_HASH_MISSING');

                const verified = await client.auth.verifyOtp({
                  token_hash: tokenHash,
                  type: 'email',
                });

                if (!verified.error && verified.data?.session?.access_token) {
                  process.stdout.write(verified.data.session.access_token.trim());
                  lastError = null;
                  break;
                }

                const status = Number(verified.error?.status ?? 0);
                lastError = new Error(
                  'PHASE_F_CANARY_VERIFY_OTP_FAILED:' + status + ':' + (verified.error?.message || 'unknown'),
                );
                if (!retryableStatuses.has(status) || attempt === 4) throw lastError;
              }
            } catch (error) {
              lastError = error instanceof Error ? error : new Error(String(error));
              const statusMatch = lastError.message.match(/PHASE_F_CANARY_(?:GENERATE_LINK|VERIFY_OTP)_FAILED:(\d+):/);
              const status = statusMatch ? Number(statusMatch[1]) : 0;
              if ((status && !retryableStatuses.has(status)) || attempt === 4) throw lastError;
            }

            await sleep(2000 * 2 ** (attempt - 1));
          }

          if (lastError) throw lastError;
          NODE
          )"
          echo "::add-mask::$token"
          printf 'RESILIENCE_CANARY_AUTH_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Live resilience probes
        env:
          RESILIENCE_TARGET_ENV: ${{ secrets.RESILIENCE_TARGET_ENV }}
          RESILIENCE_OPERATIONAL_TOKEN: ${{ secrets.RESILIENCE_OPERATIONAL_TOKEN }}
          RESILIENCE_HEALTH_URL: https://deploy-preview-730--aghbari-report-advisor.netlify.app/api/health
          RESILIENCE_CANARY_URL: https://deploy-preview-730--aghbari-report-advisor.netlify.app/api/tenant-canary
          RESILIENCE_BACKUP_VERIFY_URL: https://deploy-preview-730--aghbari-report-advisor.netlify.app/api/backup-restore-verify
          RESILIENCE_ROLLBACK_DRILL_URL: https://deploy-preview-730--aghbari-report-advisor.netlify.app/api/rollback-drill
          RESILIENCE_ALLOW_PRODUCTION: ${{ secrets.RESILIENCE_ALLOW_PRODUCTION }}
          RESILIENCE_BACKUP_MODE: ${{ secrets.RESILIENCE_BACKUP_MODE }}
          RESILIENCE_LOGICAL_SOURCE_DB_URL: ${{ secrets.RESILIENCE_LOGICAL_SOURCE_DB_URL || vars.RESILIENCE_LOGICAL_SOURCE_DB_URL }}
          RESILIENCE_MAX_RPO_SECONDS: ${{ secrets.RESILIENCE_MAX_RPO_SECONDS || vars.RESILIENCE_MAX_RPO_SECONDS }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
          SUPABASE_TEMPORARY_ACCESS_TOKEN: ${{ secrets.SUPABASE_TEMPORARY_ACCESS_TOKEN }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SUPABASE_PROJECT_REF: fnqbvfuwbdpwvhcgzksl
        run: node scripts/phase-f-live-resilience-probes.mjs
      - name: Upload Phase F readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-f-readiness-${{ env.EXACT_HEAD }}
          path: artifacts/phase-f
          if-no-files-found: warn