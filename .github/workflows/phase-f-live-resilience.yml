name: phase-f-live-resilience
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-f-live-resilience
  cancel-in-progress: false
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          test -z "$(git status --porcelain)"
          echo "EXACT_HEAD=$actual"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Local operational runtime tests
        run: node scripts/resilience-runtime.test.mjs
      - name: Static resilience contracts
        run: npm run test:operational-resilience && npm run test:release-resilience-manifest && npm run test:continuous-trust
      - name: Live resilience probes
        env:
          RESILIENCE_TARGET_ENV: ${{ secrets.RESILIENCE_TARGET_ENV }}
          RESILIENCE_OPERATIONAL_TOKEN: ${{ secrets.RESILIENCE_OPERATIONAL_TOKEN }}
          RESILIENCE_CANARY_AUTH_TOKEN: ${{ secrets.RESILIENCE_CANARY_AUTH_TOKEN }}
          RESILIENCE_HEALTH_URL: https://report-advisor.vercel.app/api/health
          RESILIENCE_CANARY_URL: https://report-advisor.vercel.app/api/tenant-canary
          RESILIENCE_BACKUP_VERIFY_URL: https://report-advisor.vercel.app/api/backup-restore-verify
          RESILIENCE_ROLLBACK_DRILL_URL: https://report-advisor.vercel.app/api/rollback-drill
          RESILIENCE_ALLOW_PRODUCTION: ${{ secrets.RESILIENCE_ALLOW_PRODUCTION }}
        run: node scripts/phase-f-live-resilience-probes.mjs
      - name: Upload Phase F readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-f-readiness-${{ env.EXACT_HEAD }}
          path: artifacts/phase-f
          if-no-files-found: warn
