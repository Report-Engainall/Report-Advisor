name: Work Item Actionability Guard

on:
  push:
    paths:
      - 'supabase/migrations/**work_item**.sql'
      - 'scripts/check-work-item-actionability-guard.mjs'
      - '.github/workflows/work-item-actionability-guard.yml'
  pull_request:
    paths:
      - 'supabase/migrations/**work_item**.sql'
      - 'scripts/check-work-item-actionability-guard.mjs'
      - '.github/workflows/work-item-actionability-guard.yml'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-work-item-actionability-guard.mjs
