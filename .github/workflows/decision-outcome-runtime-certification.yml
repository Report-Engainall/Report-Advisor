name: decision-outcome-runtime-certification

on:
  workflow_dispatch:
  push:
    branches:
      - desktop/remediation-electron44-electron

permissions:
  contents: read

concurrency:
  group: decision-outcome-runtime-certification
  cancel-in-progress: false

jobs:
  decision-outcome-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate authenticated runtime environment
        env:
          E2E_BASE_URL: https://report-advisor-git-desktop-remediation-electron44-aaf686-injaz2.vercel.app
          E2E_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          E2E_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          E2E_APPROVER_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          E2E_APPROVER_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for name in E2E_BASE_URL E2E_EMAIL E2E_PASSWORD E2E_APPROVER_EMAIL E2E_APPROVER_PASSWORD E2E_SUPABASE_URL E2E_SUPABASE_ANON_KEY VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name:-}" ]; then echo "Missing required certification environment: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then echo "AUTHENTICATED_DECISION_OUTCOME_CERTIFICATION_ENV_MISSING"; exit 1; fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real Evidence to Outcome lifecycle
        env:
          E2E_BASE_URL: https://report-advisor-git-desktop-remediation-electron44-aaf686-injaz2.vercel.app
          E2E_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_EMAIL }}
          E2E_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_A_PASSWORD }}
          E2E_APPROVER_EMAIL: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_EMAIL }}
          E2E_APPROVER_PASSWORD: ${{ secrets.REPORT_ADVISOR_E2E_USER_B_PASSWORD }}
          E2E_SUPABASE_URL: ${{ secrets.REPORT_ADVISOR_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.REPORT_ADVISOR_SUPABASE_ANON_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test tests/e2e/decision-outcome-runtime.spec.ts --reporter=line

      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-outcome-runtime-playwright-evidence
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
