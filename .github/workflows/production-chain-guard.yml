name: production-chain-guard
on:
  push: {branches: [hardening/safe-prune-and-proof]}
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-chain-guard-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Exact-head diagnostics
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-quality-to-production-chain.mjs
      - run: node scripts/check-workflow-trigger-integrity.mjs
