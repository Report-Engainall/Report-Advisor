name: w2.1-integration
on:
  pull_request:
    branches: [main, wave-final-exact-ci-16]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w2.1-integration-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Exact HEAD diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Semantic metric registry
        run: npm run test:semantic-metric-registry
      - name: Semantic metric E2E contract
        run: npm run test:semantic-metric-e2e
      - name: Decision/runtime closure
        run: npm run test:decision-intelligence-closure
      - name: Migration schema audit
        run: npm run test:migration-schema-audit
      - name: Migration dependency analysis
        run: npm run test:migration-dependencies
      - name: Production evidence linkage
        run: npm run test:production-evidence-linkage
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
