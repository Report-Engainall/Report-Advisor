name: Customer report UI surgery

on:
  push:
    branches:
      - feat/complete-smart-intelligence-surface-20261003

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'bootstrap customer report UI')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply surgical customer-facing report surface
        run: node scripts/customer-report-ui-surgery.mjs
      - name: Commit the surgery
        run: |
          git config user.name "report-advisor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ReportsPage.tsx src/components/SourceBoundReportSurface.tsx src/components/CustomerReportSurface.tsx
          git add .github/workflows/customer-report-ui-surgery.yml scripts/customer-report-ui-surgery.mjs
          git commit -m "fix: replace raw source views with executive report surfaces"
          git rm .github/workflows/customer-report-ui-surgery.yml scripts/customer-report-ui-surgery.mjs
          git commit -m "chore: remove one-off UI surgery runner"
          git push
